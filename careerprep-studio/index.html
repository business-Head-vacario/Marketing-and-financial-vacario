    {ok: RULES.numberRe.test(ctx.proof_point || ''), t:'Proof point has a number', tip:'Pick a resume bullet with a result.'},
    {ok: t.short ? body.length <= 300 : (wc >= 60 && wc <= 170), t: t.short ? `Under 300 characters (${body.length})` : `60–170 words (${wc})`, tip:'Short emails get read on a phone.'},

function appsTable(){
  const f = ui.filter.toLowerCase();

  const val = a => k === 'lastActivity' ? lastActivity(a) : k === 'next' ? (a.nextAction && a.nextAction.date || '') : a[k] ?? '';
  list = list.slice().sort((x,y) => { const a = val(x), b = val(y); return (typeof a === 'number' ? a - b : String(a).localeCompare(String(b))) * dir; });
  const th = (key, label) => `<th><button data-sort="${key}">${label}${ui.sort.k===key ? (ui.sort.dir>0?' ↑':' ↓') : ''}</button></th>`;

function setStatus(a, st, note){
  if(a.status === st) return;
  a.status = st;
  const idx = PIPE.indexOf(st);
  if(idx > (a.maxStage ?? 0)) a.maxStage = idx;
  if(st === 'Applied' && !a.dateApplied) a.dateApplied = today();
  a.timeline.push({type:'status_change', date:today(), content: note || ('Status changed to ' + st)});
  if(st === 'Applied' && (!a.nextAction || !a.nextAction.date)) a.nextAction = {text:'Follow up', date:addDays(today(), S.settings.followUpDays)};
}

    c.addEventListener('click', () => openApp(c.dataset.card));
    c.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openApp(c.dataset.card); } });
  });
  $$('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); const a = S.applications.find(x => x.id === e.dataTransfer.getData('text/plain')); if(a && a.status !== col.dataset.col){ setStatus(a, col.dataset.col); save(); render(); toast(a.company + ' → ' + col.dataset.col); } });
  });
};

function syncResumeText(){

  if(t.id === 'pk-role'){ S.profile.role = t.value; save(); render(); return; }
  if(t.id === 'rc-resume'){ S.check.resumeId = t.value; analysisCache.key = ''; save(); render(); return; }
  if(t.id === 'rc-app'){ S.check.appId = t.value; const a = S.applications.find(x => x.id === t.value); if(a && a.jdText && !S.check.jd.trim()) S.check.jd = a.jdText; linkScore(); save(); render(); return; }
  if(t.id === 'rc-file'){ const f = t.files[0]; if(f) handleFile(f); t.value = ''; return; }
  if(t.id === 'mk-vname'){ S.settings.voiceName = t.value; save(); return; }
  if(t.id === 'mk-lang'){ S.settings.recLang = t.value; save(); return; }
  if(t.id === 'prep-app'){ ui.prepApp = t.value; micStop(); ui.mock = null; clearInterval(mockTimer); ui.qSel = null; render(); return; }
  if(t.dataset.chk !== undefined){ const p = prepFor(ui.prepApp); p.checklist = p.checklist || {}; p.checklist[t.dataset.chk] = t.checked; save(); render(); return; }
  if(t.id === 'o-app'){ ui.outApp = t.value; ui.outFields = {}; ui.outDirty = false; render(); return; }
  if(t.id === 'ap-status'){ ui.statusFilter = t.value; render(); return; }
  if(t.id === 'd-status'){ const a = S.applications.find(x => x.id === drawerId); if(a){ setStatus(a, t.value); save(); renderDrawer(); render(); } return; }
  if(t.dataset.af === 'resumeId'){ const a = S.applications.find(x => x.id === drawerId); if(a){ a.resumeId = t.value; save(); } return; }
  if(t.id === 'set-theme'){ S.settings.theme = t.value || null; applyTheme(); save(); return; }
  if(t.id === 'imp-file'){ const f = t.files[0]; t.value = ''; if(!f) return; f.text().then(txt => { const d = JSON.parse(txt); if(!d || !Array.isArray(d.applications)) throw new Error('bad'); ui.importData = d; render(); }).catch(() => toast('That file is not a CareerPrep backup.')); return; }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && drawerId){ closeDrawer(); return; }
  const tag = (e.target.tagName||'').toLowerCase();
  if((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey && !e.altKey && !['input','textarea','select'].includes(tag) && !e.target.isContentEditable && !drawerId && S.settings.onboarded){ e.preventDefault(); newApp(); }
  if(e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-open]')) openApp(e.target.dataset.open);
});
$('#theme-btn').addEventListener('click', () => {
  const dark = S.settings.theme ? S.settings.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.settings.theme = dark ? 'light' : 'dark'; applyTheme(); save(); if(view === 'settings') render();
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if(VIEWS.some(x => x.id === v) && v !== view){ view = v; render(); } });
document.addEventListener('visibilitychange', () => {});

/* ---------- boot ---------- */
Object.assign(actions, EXTRA_ACTIONS);
applyTheme();
if(S.check.appId) linkScore();
render();
renderBoard(true);
save();
})();
</script>

</body>
</html>
