    S.outreach.push({date:today(), to:ctx.recruiter, company:ctx.company, subject:ui.outSubject, template:t ? t.name : ''});
    let a = S.applications.find(x => x.id === ui.outApp);
    if(!a && ctx.company){ a = {id:uid('a'), company:ctx.company, role:ctx.role||'', jobLink:'', jdText:'', resumeId:S.check.resumeId||'', atsScore:0, status:'Saved', dateApplied:'', contact:{name:ctx.recruiter||'', email:ui.outFields.email||''}, salaryRange:'', notes:'', nextAction:{text:'Follow up on cold email', date:addDays(today(), 5)}, timeline:[], prep:{star:{},checklist:{},mocks:[],research:''}, maxStage:0}; S.applications.unshift(a); ui.outApp = a.id; }
    if(a){ a.timeline.push({type:'email_sent', date:today(), content:(t ? t.name + ': ' : '') + ui.outSubject + '\n\n' + ui.outBody}); if(t && /^t1$/.test(t.id)) setStatus(a, 'Applied'); if(t && t.cold && (!a.nextAction || !a.nextAction.date)) a.nextAction = {text:'Follow up on cold email', date:addDays(today(), 5)}; }
    save(); render(); toast(a ? 'Logged on ' + a.company + '’s timeline' : 'Logged');
  },
  'close-drawer': () => closeDrawer(),
  'close-overlay': (e) => { if(e.target.classList.contains('overlay')) closeDrawer(); },
  'd-prep': () => { ui.prepApp = drawerId; closeDrawer(); go('prep'); },
  'd-email': () => { ui.outApp = drawerId; ui.outFields = {}; ui.outDirty = false; const a = S.applications.find(x => x.id === drawerId); ui.outTpl = a && a.status === 'Interview' ? 't3' : a && a.status === 'Offer' ? 't4' : a && a.status === 'Applied' ? 't2' : 'c1'; closeDrawer(); go('outreach'); },
  'd-check': () => { const a = S.applications.find(x => x.id === drawerId); if(a){ if(a.jdText) S.check.jd = a.jdText; S.check.appId = a.id; if(a.resumeId && resumeById(a.resumeId)) S.check.resumeId = a.resumeId; } closeDrawer(); go('resume'); },
  'read-reply': () => { const txt = $('#d-reply').value.trim(); if(!txt){ toast('Paste the reply first'); return; } replyGuess = Object.assign(parseReply(txt), {text:txt}); renderDrawer(); },
  'cancel-reply': () => { replyGuess = null; renderDrawer(); },
  'confirm-reply': () => {
    const a = S.applications.find(x => x.id === drawerId); if(!a || !replyGuess) return;
    a.timeline.push({type:'reply_received', date:today(), content:replyGuess.text});
    const st = $('#d-rs').value, d = $('#d-rd').value, txt = $('#d-rt').value;
    if(st !== a.status) setStatus(a, st, 'Status changed to ' + st + ' after reply');
    if(d) a.nextAction = {text: txt || 'Next step', date:d};
    replyGuess = null; save(); renderDrawer(); render(); toast('Reply saved');
  },
  'add-note': () => { const a = S.applications.find(x => x.id === drawerId); const v = $('#d-note').value.trim(); if(!a || !v) return; a.timeline.push({type:'note', date:today(), content:v}); save(); renderDrawer(); },
  'del-app': () => { if(ui.confirm !== 'del-app'){ ui.confirm = 'del-app'; renderDrawer(); return; } S.applications = S.applications.filter(x => x.id !== drawerId); drawerId = null; ui.confirm = null; $('#modal').innerHTML = ''; save(); render(); toast('Application deleted'); },
  'import-merge': () => { const d = ui.importData; const ids = new Set(S.applications.map(a => a.id)); d.applications.forEach(a => { if(!ids.has(a.id)) S.applications.push(a); }); const rids = new Set(S.resumes.map(r => r.id)); (d.resumes||[]).forEach(r => { if(!rids.has(r.id)) S.resumes.push(r); }); S = migrate(S); ui.importData = null; save(); render(); toast('Backup merged'); },
  'import-replace': () => { S = migrate(ui.importData); S.settings.examples = false; ui.importData = null; save(); applyTheme(); render(); toast('Backup restored'); },
  'reset-all': () => { if(ui.confirm !== 'reset'){ ui.confirm = 'reset'; render(); return; } ui.confirm = null; S = freshState(); save(); render(); toast('All data erased'); },
  'load-examples': () => { const keep = S.applications.filter(a => !a.example); S = seed(Object.assign(freshState(), {applications:keep})); save(); render(); toast('Example data loaded'); }
};

function syncResumeText(){
  const ta = $('#rc-text'); if(!ta) return;
  const txt = ta.value;
  let r = resumeById(S.check.resumeId);
  if(!r && txt.trim()){ r = {id:uid('r'), label:'Pasted resume', text:txt, added:today(), meta:{source:'paste'}}; S.resumes.push(r); S.check.resumeId = r.id; }
  else if(r && r.text !== txt){ r.text = txt; if(r.meta && r.meta.source !== 'paste') r.meta = Object.assign({}, r.meta, {edited:true}); }
}

let inputTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'rc-text' || t.id === 'rc-jd'){
    if(t.id === 'rc-jd') S.check.jd = t.value; else syncResumeText();
    save(); clearTimeout(inputTimer);
    inputTimer = setTimeout(() => { analysisCache.key = ''; linkScore(); const res = $('#view'); const y = window.scrollY; const act = document.activeElement && document.activeElement.id; const pos = document.activeElement && document.activeElement.selectionStart; render(); window.scrollTo(0, y); if(act){ const el = document.getElementById(act); if(el){ el.focus({preventScroll:true}); try { el.setSelectionRange(pos, pos); } catch(_){} } } }, 700);
    return;
  }
  if(t.id === 'pt-extra'){ ui.ptExtra = t.value; const out = $('#pt-out'); const a = currentAnalysis(); if(out && a) out.value = buildPrompt(a); return; }
  if(t.dataset.star){ const p = prepFor(ui.prepApp); p.star = p.star || {}; p.star[ui.qSel] = p.star[ui.qSel] || {s:'',t:'',a:'',r:''}; p.star[ui.qSel][t.dataset.star] = t.value; save(); clearTimeout(inputTimer); inputTimer = setTimeout(() => softRerender(), 900); return; }
  if(t.id === 'prep-research'){ prepFor(ui.prepApp).research = t.value; save(); clearTimeout(inputTimer); inputTimer = setTimeout(() => softRerender(), 900); return; }
  if(t.id === 'mk-note' && ui.mock){ ui.mock.notes[ui.mock.i] = t.value; return; }
  if(t.dataset.of){ ui.outFields[t.dataset.of] = t.value; ui.outDirty = false; ui.confirm = null; clearTimeout(inputTimer); inputTimer = setTimeout(() => softRerender(), 350); return; }
  if(t.id === 'o-subj' || t.id === 'o-body'){ ui.outDirty = true; if(t.id === 'o-subj') ui.outSubject = t.value; else ui.outBody = t.value; clearTimeout(inputTimer); inputTimer = setTimeout(() => softRerender(), 600); return; }
  if(t.dataset.tf){ const card = t.closest('[data-tid]'); const tp = S.templates.find(x => x.id === card.dataset.tid); if(tp){ tp[t.dataset.tf] = t.value; if(t.dataset.tf === 'group') tp.cold = t.value === 'Cold outreach'; save(); } return; }
  if(t.dataset.af){ const a = S.applications.find(x => x.id === drawerId); if(!a) return; const [k1,k2] = t.dataset.af.split('.'); if(k2) a[k1][k2] = t.value; else a[k1] = t.value; save(); if(k1 === 'company'){ const h = $('.drawer h2'); if(h) h.textContent = t.value || 'Untitled'; } return; }
  if(t.dataset.pf){ S.profile[t.dataset.pf] = t.dataset.pf === 'years_experience' ? +t.value : t.value; save(); return; }
  if(t.dataset.sf2){ S.settings[t.dataset.sf2] = Math.max(1, +t.value || 1); save(); return; }
  if(t.id === 'ap-filter'){ ui.filter = t.value; clearTimeout(inputTimer); inputTimer = setTimeout(() => softRerender(), 250); return; }
});
function softRerender(){
  const act = document.activeElement; const id = act && (act.id || ''); const key = act && act.dataset ? (act.dataset.star || act.dataset.of || '') : '';
  const pos = act && 'selectionStart' in act ? act.selectionStart : null; const y = window.scrollY;
  render(); window.scrollTo(0, y);
  let el = id ? document.getElementById(id) : null;
  if(!el && key) el = $(`[data-star="${key}"]`) || $(`[data-of="${key}"]`);
  if(el){ el.focus({preventScroll:true}); if(pos != null){ try { el.setSelectionRange(pos, pos); } catch(_){} } }
}
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'pk-ind'){ S.profile.industry = t.value; S.profile.role = PACKS[t.value].roles[0]; analysisCache.key = ''; ui.qSel = null; save(); render(); toast(PACKS[t.value].label + ' pack loaded'); return; }
  if(t.id === 'pk-role'){ S.profile.role = t.value; save(); render(); return; }
  if(t.id === 'rc-resume'){ S.check.resumeId = t.value; analysisCache.key = ''; save(); render(); return; }
  if(t.id === 'rc-app'){ S.check.appId = t.value; const a = S.applications.find(x => x.id === t.value); if(a && a.jdText && !S.check.jd.trim()) S.check.jd = a.jdText; linkScore(); save(); render(); return; }
  if(t.id === 'rc-file'){ const f = t.files[0]; if(f) handleFile(f); t.value = ''; return; }
  if(t.id === 'prep-app'){ ui.prepApp = t.value; ui.mock = null; clearInterval(mockTimer); ui.qSel = null; render(); return; }
  if(t.dataset.chk !== undefined){ const p = prepFor(ui.prepApp); p.checklist = p.checklist || {}; p.checklist[t.dataset.chk] = t.checked; save(); render(); return; }
  if(t.id === 'o-app'){ ui.outApp = t.value; ui.outFields = {}; ui.outDirty = false; render(); return; }
  if(t.id === 'ap-status'){ ui.statusFilter = t.value; render(); return; }
  if(t.id === 'd-status'){ const a = S.applications.find(x => x.id === drawerId); if(a){ setStatus(a, t.value); save(); renderDrawer(); render(); } return; }
  if(t.dataset.af === 'resumeId'){ const a = S.applications.find(x => x.id === drawerId); if(a){ a.resumeId = t.value; save(); } return; }
  if(t.id === 'set-theme'){ S.settings.theme = t.value || null; applyTheme(); save(); return; }
  if(t.id === 'imp-file'){ const f = t.files[0]; t.value = ''; if(!f) return; f.text().then(txt => { const d = JSON.parse(txt); if(!d || !Array.isArray(d.applications)) throw new Error('bad'); ui.importData = d; render(); }).catch(() => toast('That file is not a CareerPrep backup.')); return; }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && drawerId){ closeDrawer(); return; }
  const tag = (e.target.tagName||'').toLowerCase();
  if((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey && !e.altKey && !['input','textarea','select'].includes(tag) && !e.target.isContentEditable && !drawerId){ e.preventDefault(); newApp(); }
  if(e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-open]')) openApp(e.target.dataset.open);
});
$('#theme-btn').addEventListener('click', () => {
  const dark = S.settings.theme ? S.settings.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.settings.theme = dark ? 'light' : 'dark'; applyTheme(); save(); if(view === 'settings') render();
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if(VIEWS.some(x => x.id === v) && v !== view){ view = v; render(); } });
document.addEventListener('visibilitychange', () => {});

/* ---------- boot ---------- */
applyTheme();
if(S.check.appId) linkScore();
render();
renderBoard(true);
save();
})();
</script>
