<title>CareerPrep Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">

<style>
/* Layout: a concierge desk. Fixed left rail, a split-flap departures strip that always shows the next move, and working panels below. */
:root{
  color-scheme: light;
  --bg:#eceff3; --surface:#ffffff; --well:#f4f6f9; --line:#d8dee6; --line-2:#c3ccd7;
  --ink:#122033; --ink-2:#4f5d70; --ink-3:#7f8b9b;
  --accent:#0b6e69; --accent-ink:#ffffff; --accent-soft:#d5ecea; --accent-deep:#074c49;
  --brass:#a8742a; --brass-soft:#f5e8d2;
  --good:#1b7f47; --good-soft:#dcf1e4; --warn:#a96a0e; --warn-soft:#fbecd2; --bad:#bf3a33; --bad-soft:#f9dfdc;
  --board:#121a24; --board-2:#1b2633; --board-ink:#f3c14f; --board-dim:#8a96a6;
  --s1:#0b6e69; --s2:#a8742a; --s3:#3b6fb6; --s4:#8a4fa3; --s5:#1b7f47;
  --shadow:0 1px 2px rgba(18,32,51,.06), 0 10px 24px -14px rgba(18,32,51,.28);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0b1119; --surface:#121b26; --well:#18222f; --line:#243244; --line-2:#334459;
    --ink:#e6ecf3; --ink-2:#a3b0c0; --ink-3:#6f7f93;
    --accent:#3cc0b4; --accent-ink:#06201e; --accent-soft:#103a38; --accent-deep:#7fdcd2;
    --brass:#e0ae5f; --brass-soft:#3a2c17;
    --good:#4cc683; --good-soft:#12301f; --warn:#e9a93c; --warn-soft:#352711; --bad:#f07067; --bad-soft:#3a1715;
    --board:#070b10; --board-2:#111923; --board-ink:#f3c14f; --board-dim:#7d8a9b;
    --s1:#3cc0b4; --s2:#e0ae5f; --s3:#6f9de0; --s4:#c08ad6; --s5:#4cc683;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0b1119; --surface:#121b26; --well:#18222f; --line:#243244; --line-2:#334459;
  --ink:#e6ecf3; --ink-2:#a3b0c0; --ink-3:#6f7f93;
  --accent:#3cc0b4; --accent-ink:#06201e; --accent-soft:#103a38; --accent-deep:#7fdcd2;
  --brass:#e0ae5f; --brass-soft:#3a2c17;
  --good:#4cc683; --good-soft:#12301f; --warn:#e9a93c; --warn-soft:#352711; --bad:#f07067; --bad-soft:#3a1715;
  --board:#070b10; --board-2:#111923; --board-ink:#f3c14f; --board-dim:#7d8a9b;
  --s1:#3cc0b4; --s2:#e0ae5f; --s3:#6f9de0; --s4:#c08ad6; --s5:#4cc683;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800;line-height:1.1}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.eyebrow{font:600 .7rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--board);color:#dfe6ee;padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font:800 1.08rem/1.05 var(--f-display);color:#fff;display:block}
.brand small{font:500 .64rem/1 var(--f-mono);letter-spacing:.14em;color:var(--board-dim);text-transform:uppercase}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;background:transparent;color:#b8c4d2;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.navbtn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--board-2);color:#fff}
.navbtn[aria-current="page"]{background:var(--board-2);color:var(--board-ink);box-shadow:inset 3px 0 0 var(--board-ink)}
.navbtn .count{margin-left:auto;font:600 .7rem var(--f-mono);background:#2a3646;color:#dfe6ee;padding:2px 7px;border-radius:99px}
.rail-foot{margin-top:auto;font-size:.75rem;color:var(--board-dim);padding:0 8px;line-height:1.45}
.rail-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4cc683;margin-right:6px;vertical-align:1px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.pack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pack label{font:600 .68rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.topbar .spacer{flex:1}
.board{background:var(--board);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;overflow:hidden;color:var(--board-ink);font:600 .82rem/1 var(--f-mono);letter-spacing:.06em;min-width:0;margin:18px 28px 0}
.board .tag{color:var(--board-dim);font-size:.68rem;letter-spacing:.14em;flex:none}
.flap{display:flex;gap:2px;flex-wrap:wrap;min-width:0}
.flap span{display:inline-block;min-width:.9em;text-align:center;background:var(--board-2);padding:6px 2px;border-radius:3px;position:relative;text-transform:uppercase}
.flap span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55)}
.flap span.sp{background:transparent;min-width:.55em}
.flap span.sp::after{display:none}
.board .status{margin-left:auto;flex:none;padding:5px 9px;border-radius:4px;background:#1f3a2a;color:#7fe0a6;font-size:.7rem}
.board .status.late{background:#3f1d1b;color:#ff9f97}
#view{padding:22px 28px 60px;display:flex;flex-direction:column;gap:20px;min-width:0}
.banner{margin:16px 28px 0;padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner .grow{flex:1;min-width:200px}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--well)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 9px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea.input{resize:vertical;line-height:1.5}
.input:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
.input.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.panel-h .grow{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid transparent;line-height:1.5}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.miss{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--well);color:var(--ink-2);border-color:var(--line)}
.chip.brass{background:var(--brass-soft);color:var(--brass)}
.chip .w{font:600 .66rem var(--f-mono);opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 .68rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;display:inline-block;white-space:nowrap}
.st-Saved{background:var(--well);color:var(--ink-2)}
.st-Applied{background:color-mix(in srgb,var(--s3) 18%,transparent);color:var(--s3)}
.st-Replied{background:color-mix(in srgb,var(--s4) 18%,transparent);color:var(--s4)}
.st-Interview{background:var(--brass-soft);color:var(--brass)}
.st-Offer{background:var(--good-soft);color:var(--good)}
.st-Rejected{background:var(--bad-soft);color:var(--bad)}
.st-Ghosted{background:var(--well);color:var(--ink-3);border:1px dashed var(--line-2)}
.st-Withdrawn{background:var(--well);color:var(--ink-3)}
.prio-High{background:var(--bad-soft);color:var(--bad)}
.prio-Medium{background:var(--warn-soft);color:var(--warn)}
.prio-Low{background:var(--well);color:var(--ink-2)}
.tabs{display:flex;gap:4px;background:var(--well);padding:4px;border-radius:10px;border:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:12px;font-size:.92rem}
.note{font-size:.8rem;color:var(--ink-3)}
.hr{height:1px;background:var(--line);margin:4px 0}
.scroll-x{overflow-x:auto}

/* ---------- page header ---------- */
.pagehead{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.pagehead .grow{flex:1;min-width:240px}
.pagehead p{color:var(--ink-2);max-width:62ch;margin-top:6px}

/* ---------- dashboard ---------- */
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.kpi .v{font:800 2.1rem/1 var(--f-display);letter-spacing:-.02em}
.kpi .s{font-size:.8rem;color:var(--ink-2)}
.route svg{width:100%;height:auto;display:block}
.today li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.today li:last-child{border-bottom:0}
.today ul{list-style:none;margin:0;padding:0}
.datebox{flex:none;width:48px;text-align:center;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;font-family:var(--f-mono)}
.datebox b{display:block;font-size:1.05rem;padding:3px 0 1px}
.datebox i{display:block;font-style:normal;font-size:.62rem;letter-spacing:.1em;background:var(--well);padding:2px 0;color:var(--ink-2)}
.datebox.late{border-color:var(--bad)}
.datebox.late i{background:var(--bad);color:#fff}

/* ---------- resume check ---------- */
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:18px;display:flex;gap:14px;align-items:center;background:var(--well);cursor:pointer;transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{flex:none;width:38px;height:38px;stroke:var(--accent);fill:none;stroke-width:1.6}
.drop b{display:block}
.gaugewrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:center}
.gauge{width:220px;max-width:100%}
.gauge svg{width:100%;height:auto;display:block}
.bars{display:flex;flex-direction:column;gap:11px}
.bar .lbl{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:4px;gap:10px}
.bar .lbl b{font-weight:600}
.bar .track{height:9px;background:var(--well);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.gapmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gaptile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--well);min-width:0}
.gaptile .k{font-size:.74rem;color:var(--ink-2);font-weight:600}
.gaptile .v{font-weight:700;font-size:.92rem;overflow-wrap:anywhere}
.gaptile.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.gaptile.miss{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.gaptile.part{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.sugg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.sugg:last-child{border-bottom:0}
.sugg .quote{font-size:.82rem;color:var(--ink-2);border-left:3px solid var(--line-2);padding:2px 0 2px 9px;margin-top:6px;overflow-wrap:anywhere}
.sugg.done{opacity:.55}
.sugg.done .txt{text-decoration:line-through}
.disclaimer{font-size:.78rem;color:var(--ink-3);display:flex;gap:6px;align-items:flex-start}

/* ---------- prep ---------- */
.qlist{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto;padding-right:4px}
.q{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.q:hover{border-color:var(--line-2)}
.q[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.q .tick{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);margin-top:2px;display:grid;place-items:center}
.q .tick.on{background:var(--good);border-color:var(--good)}
.q .tick.on::after{content:"";width:6px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.q small{display:block;color:var(--ink-3);font:600 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.star{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.star .L{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:800 1.05rem var(--f-display);color:#fff}
.mock-stage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center}
.mock-q{font:700 1.45rem/1.25 var(--f-display);text-wrap:balance}
.rate{display:flex;gap:6px}
.rate button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.readiness{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center}
.legend{display:flex;flex-direction:column;gap:8px;font-size:.85rem}
.legend div{display:flex;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .val{margin-left:auto;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}

/* ---------- outreach ---------- */
.out{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.tpl-group{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.tpl{border:1px solid transparent;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:500}
.tpl:hover{background:var(--well)}
.tpl[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--ink);font-weight:600}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:8px;border-radius:2px;background:var(--well);border:1px solid var(--line)}
.meter i.on{border-color:transparent}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .mk{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:.65rem;font-weight:800;margin-top:2px}
.checks .y{background:var(--good-soft);color:var(--good)}
.checks .n{background:var(--bad-soft);color:var(--bad)}
.preview{white-space:pre-wrap;font-size:.9rem;line-height:1.6;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-wrap:anywhere}
.preview mark{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:0 3px;font-weight:600}
.proof{display:flex;flex-direction:column;gap:6px}
.proof button{text-align:left;border:1px solid var(--line);background:var(--well);border-radius:8px;padding:7px 10px;font-size:.8rem;cursor:pointer;color:var(--ink-2)}
.proof button:hover{border-color:var(--accent);color:var(--ink)}

/* ---------- applications ---------- */
table.t{width:100%;border-collapse:collapse;font-size:.88rem;min-width:780px}
.t th{text-align:left;font:600 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.t th button{border:0;background:transparent;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0}
.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--well)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.col h4{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;color:var(--ink-2);padding:2px 4px 4px}
.pass{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pass::before,.pass::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--well);border:1px solid var(--line);top:calc(62% - 6px)}
.pass::before{left:-7px;clip-path:inset(0 0 0 50%)}
.pass::after{right:-7px;clip-path:inset(0 50% 0 0)}
.pass .co{font-weight:700;font-size:.92rem}
.pass .ro{font-size:.8rem;color:var(--ink-2)}
.pass .perf{border-top:1px dashed var(--line-2);margin-top:9px;padding-top:7px;display:flex;justify-content:space-between;font:600 .7rem var(--f-mono);color:var(--ink-3)}
.pass.dragging{opacity:.4}
.flag{font:600 .64rem var(--f-mono);color:var(--warn);letter-spacing:.06em;text-transform:uppercase}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-24px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .when{font:600 .7rem var(--f-mono);color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.timeline .body{font-size:.86rem;white-space:pre-wrap;color:var(--ink-2);max-height:120px;overflow:auto;overflow-wrap:anywhere}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,14,22,.55);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:-20px 0 40px rgba(0,0,0,.25);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
kbd{font:600 .72rem var(--f-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--well)}

/* =====================================================================
   TEXT ENGINE — normalise, extract keywords, detect sections, score
   ===================================================================== */
const SYN_RES = SYNONYMS.map(([a,b]) => [new RegExp('(^|[^a-z0-9])' + a.replace(/[.*+?^${}()|[\]\\&]/g,'\\$&') + '(?=$|[^a-z0-9])','g'), '$1'+b]);
function normalize(t){
  let s = ' ' + String(t||'').toLowerCase().replace(/[‘’]/g,"'").replace(/[–—]/g,' ') + ' ';
  s = s.replace(/[•·▪●◦►✓|\t]/g,' ');
  for(const [re, rep] of SYN_RES) s = s.replace(re, rep);
  s = s.replace(/[^a-z0-9+#&%\/\-.\s]/g,' ').replace(/\.(?=\s|$)/g,' ').replace(/(^|\s)[\-\/]+(?=\s)/g,' ').replace(/\s+/g,' ');
  return ' ' + s.trim() + ' ';
}
function countOcc(padded, term){
  const needle = ' ' + term + ' ';
  let n = 0, i = padded.indexOf(needle);
  while(i !== -1){ n++; i = padded.indexOf(needle, i + needle.length - 1); }
  return n;
}
function dictionaryFor(packKey){
  const set = new Set(GENERAL_SKILLS);
  Object.values(PACKS).forEach(p => p.keywords.forEach(k => set.add(k)));
  return Array.from(set).map(k => normalize(k).trim()).filter(Boolean);
}
function requiredBlock(jd){
  const lines = String(jd||'').split(/\r?\n/);
  let on = false; const out = [];
  for(const raw of lines){
    const l = raw.trim();
    const isHead = l.length < 60 && !/^[-•*]/.test(l) && /[a-z]/i.test(l) && (l.split(/\s+/).length <= 6);
    if(isHead && /(requirement|qualification|must have|essential|what you.ll need|you have|skills required|who you are|eligibility)/i.test(l)){ on = true; continue; }
    if(isHead && on && /(about|responsibilit|benefit|what we offer|perks|how to apply|role)/i.test(l)){ on = false; continue; }
    if(on) out.push(l);
  }
  return normalize(out.join(' '));
}
function extractKeywords(jd, packKey){
  const n = normalize(jd);
  const req = requiredBlock(jd);
  const kws = new Map();
  const pack = PACKS[packKey];
  for(const k of dictionaryFor(packKey)){
    const c = countOcc(n, k);
    if(c > 0) kws.set(k, {term:k, count:c, src: pack && pack.keywords.map(x=>normalize(x).trim()).includes(k) ? 'pack' : 'dict'});
  }
  const toks = n.trim().split(' ').filter(Boolean);
  const good = w => w.length > 2 && !STOP.has(w) && !/^\d+$/.test(w) && /[a-z]/.test(w);
  const grams = new Map();
  for(const size of [2,3]){
    for(let i=0; i + size <= toks.length; i++){
      const g = toks.slice(i, i+size);
      if(!g.every(good)) continue;
      const key = g.join(' ');
      grams.set(key, (grams.get(key)||0) + 1);
    }
  }
  const covered = term => Array.from(kws.keys()).some(k => k.includes(term) || term.includes(k));
  for(const [g, c] of grams){ if(c >= 2 && !covered(g)) kws.set(g, {term:g, count:c, src:'phrase'}); }
  const singles = new Map();
  toks.forEach(w => { if(good(w) && w.length >= 4) singles.set(w, (singles.get(w)||0) + 1); });
  for(const [w, c] of singles){ if(c >= 3 && !covered(w)) kws.set(w, {term:w, count:c, src:'repeat'}); }
  const list = Array.from(kws.values()).map(k => {
    const inReq = countOcc(req, k.term) > 0;
    k.req = inReq;
    k.weight = (k.count >= 2 ? 2 : 1) * (inReq ? 2 : 1) * (k.src === 'pack' ? 1.25 : 1);
    return k;
  });
  list.sort((a,b) => b.weight - a.weight || b.count - a.count || a.term.localeCompare(b.term));
  return list.slice(0, 30);
}

const SECTION_RES = {
  contact:/^(contact|contact details|personal details|personal information)$/,
  summary:/^(summary|profile|professional summary|career summary|career objective|objective|about me|professional profile)$/,
  experience:/^(experience|work experience|professional experience|employment|employment history|work history|career history|relevant experience)$/,
  education:/^(education|academic|academics|qualifications|academic qualifications|education and training)$/,
  skills:/^(skills|key skills|core skills|technical skills|competencies|core competencies|areas of expertise|skills and competencies)$/,
  projects:/^(projects|key projects|events delivered|achievements|key achievements|portfolio)$/,
  certifications:/^(certifications|certificates|certification|licen[cs]es|training|courses|certifications and training|licenses and certifications)$/,
  languages:/^(languages|language skills|languages known)$/
};
const SECTION_LABEL = {contact:'Contact',summary:'Summary',experience:'Experience',education:'Education',skills:'Skills',projects:'Projects',certifications:'Certifications',languages:'Languages'};

function parseResume(text){
  const lines = String(text||'').split(/\r?\n/).map(l => l.replace(/\s+$/,'')).filter(l => l.trim());
  const sections = {}; let cur = null;
  const bullets = [];
  lines.forEach((raw, idx) => {
    const l = raw.trim();
    const key = l.toLowerCase().replace(/[^a-z& ]/g,' ').replace(/&/g,'and').replace(/\s+/g,' ').trim();
    if(l.length <= 45 && l.split(/\s+/).length <= 5){
      for(const s in SECTION_RES){ if(SECTION_RES[s].test(key)){ sections[s] = idx; cur = s; return; } }
    }
    const isBullet = /^[•·▪●◦►✓\-*–]\s*/.test(l);
    const body = l.replace(/^[•·▪●◦►✓\-*–]\s*/,'').trim();
    if((isBullet || (cur === 'experience' && body.split(/\s+/).length >= 7)) && (cur === 'experience' || cur === 'projects' || cur === null || isBullet) && cur !== 'skills' && cur !== 'languages' && cur !== 'education'){
      if(body.split(/\s+/).length >= 4 && !/\(\s*\d{4}/.test(body)) bullets.push({text:body, line:idx, section:cur});
    }
  });
  const email = (text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/)||[])[0] || '';
  const phone = (text.match(/(\+?\d[\d\s\-()]{8,}\d)/)||[])[0] || '';
  const emailLine = lines.findIndex(l => email && l.includes(email));
  const words = (text.match(/\S+/g)||[]).length;
  return {lines, sections, bullets, email, phone, emailLine, words};
}

function analyze(resume, jd, packKey){
  const meta = resume.meta || {};
  const text = resume.text || '';
  const P = parseResume(text);
  const nres = normalize(text);
  const pack = PACKS[packKey] || PACKS.hospitality;
  const kws = extractKeywords(jd, packKey);
  let tot = 0, got = 0; const matched = [], missing = [];
  kws.forEach(k => { tot += k.weight; if(countOcc(nres, k.term) > 0){ got += k.weight; matched.push(k); } else missing.push(k); });
  const kwScore = tot ? got / tot : 0;

  const core = ['summary','experience','education','skills'];
  const hasContact = !!(P.email || P.phone) || ('contact' in P.sections);
  const coreFound = core.filter(s => s in P.sections).length + (hasContact ? 1 : 0);
  const secScore = coreFound / 5;

  const fmtIssues = [];
  let fmt = 1;
  if(meta.tables){ fmt -= .4; fmtIssues.push('Tables found — many ATS tools read table cells out of order.'); }
  const pipeLines = P.lines.filter(l => (l.match(/\|/g)||[]).length >= 2 && !l.includes('@')).length;
  if(!meta.tables && pipeLines >= 3){ fmt -= .25; fmtIssues.push('Several lines use | separators, which often come from tables.'); }
  if(meta.columns){ fmt -= .35; fmtIssues.push('Two-column layout detected — ATS tools may mix the columns together.'); }
  if(meta.images){ fmt -= .2; fmtIssues.push('Images or icons found — ATS tools ignore them, and photos can block parsing.'); }
  if(P.email && P.emailLine > 8){ fmt -= .2; fmtIssues.push('Contact details are not near the top; they may be in a footer that ATS tools skip.'); }
  const fancy = (text.match(/[★☆✦❖➤➢◆■□]/g)||[]).length;
  if(fancy > 4){ fmt -= .1; fmtIssues.push('Decorative symbols may turn into junk characters.'); }
  fmt = clamp(fmt, 0, 1);

  const bl = P.bullets;
  const firstWord = b => b.text.toLowerCase().split(/\s+/)[0].replace(/[^a-z]/g,'');
  const strong = bl.filter(b => { const w = firstWord(b); return RULES.strongVerbs.includes(w) || (/ed$/.test(w) && w.length > 4); });
  const withNum = bl.filter(b => RULES.numberRe.test(b.text));
  const expScore = bl.length ? (strong.length/bl.length)*.5 + (withNum.length/bl.length)*.5 : 0;

  const pages = meta.pages || Math.max(1, Math.ceil(P.words / RULES.wordsPerPage));
  let lenScore = 0;
  if(P.words >= RULES.minWords && pages <= RULES.maxPages) lenScore += .5; else if(P.words >= 150 && pages <= 3) lenScore += .25;
  if(P.email) lenScore += .25;
  if(P.phone) lenScore += .25;

  const comps = [
    {key:'kw',label:'Keyword match',w:50,v:kwScore,detail:`${matched.length} of ${kws.length} JD keywords`},
    {key:'sec',label:'Section completeness',w:15,v:secScore,detail:`${coreFound} of 5 core sections`},
    {key:'fmt',label:'Formatting / parseability',w:15,v:fmt,detail:fmtIssues.length ? `${fmtIssues.length} risk${fmtIssues.length>1?'s':''}` : 'No parse risks found'},
    {key:'exp',label:'Experience evidence',w:10,v:expScore,detail:`${withNum.length}/${bl.length} bullets with numbers`},
    {key:'len',label:'Length and contact',w:10,v:lenScore,detail:`${P.words} words · ~${pages} page${pages>1?'s':''}`}
  ];
  const score = Math.round(comps.reduce((s,c) => s + c.v*c.w, 0));

  // industry gap map
  const certs = pack.certs.map(([k, label]) => ({label, found: countOcc(nres, normalize(k).trim()) > 0}));
  const metrics = pack.metrics.map(m => ({label:m, found: countOcc(nres, normalize(m).trim()) > 0}));
  const outcomeRe = new RegExp('\\b(' + pack.outcome.join('|') + ')\\b','i');
  const outcomeBul = bl.filter(b => outcomeRe.test(b.text) && RULES.numberRe.test(b.text));
  const safetyFound = pack.safety ? (pack.safetyTerms||[]).filter(t => countOcc(nres, normalize(t).trim()) > 0) : [];

  const res = {score, comps, matched, missing, kws, P, fmtIssues, pages, certs, metrics, outcomeBul, safetyFound, packKey, strong, withNum};
  res.suggestions = suggest(res, pack, jd);
  return res;
}

function sid(rule, txt){ let h = 0; const s = rule + '|' + txt; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0; return rule + ':' + (h>>>0).toString(36); }

function suggest(r, pack, jd){
  const out = [];
  const add = (rule, prio, text, line) => out.push({id:sid(rule, text + (line||'')), rule, prio, text, line});
  r.missing.slice(0, 14).forEach((k, i) => {
    const hi = k.weight >= 2 || i < 4;
    add('Missing keyword', hi ? 'High' : 'Medium', `Add “${k.term}” if you have used it — it appears ${k.count} time${k.count>1?'s':''} in the JD${k.req?' and in the requirements':''}.`);
  });
  const bl = r.P.bullets;
  bl.forEach(b => {
    const low = b.text.toLowerCase();
    const weak = RULES.weakOpeners.find(w => low.startsWith(w));
    if(weak) add('Weak opening verb','Medium',`Starts with “${weak[0].toUpperCase()+weak.slice(1)}”. Open with a verb like Led, Resolved, Reduced or Trained.`, b.text);
    if(!RULES.numberRe.test(b.text)) add('No measurable result','Medium',`Add a result: how much, how many or how fast. For ${pack.label.toLowerCase()} that could be ${pack.metricHint}.`, b.text);
    const wc = b.text.split(/\s+/).length;
    if(wc > RULES.bulletMaxWords) add('Bullet too long','Low',`${wc} words. Split into two bullets or trim to under ${RULES.bulletMaxWords}.`, b.text);
  });
  const verbs = {};
  bl.forEach(b => { const w = b.text.split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,''); if(w) (verbs[w] = verbs[w]||[]).push(b); });
  Object.entries(verbs).forEach(([v, list]) => { if(list.length >= RULES.repeatedVerbMin) add('Repeated verb','Low',`“${v}” starts ${list.length} bullets. Vary the verbs.`, list[0].text); });
  ['summary','experience','education','skills'].forEach(s => { if(!(s in r.P.sections)) add('Missing section', s==='experience'||s==='skills' ? 'High' : 'Medium', `Add a clear “${SECTION_LABEL[s]}” heading so ATS tools can find this section.`); });
  r.fmtIssues.forEach(f => add('Parse risk','High', f + ' Use a single-column layout with plain headings.'));
  if(r.pages > RULES.maxPages) add('Length','Medium',`About ${r.pages} pages. Trim older roles to keep it to two pages.`);
  if(r.P.words < RULES.minWords) add('Length','Medium',`Only ${r.P.words} words. Add detail and results to your recent roles.`);
  if(!r.P.email) add('Contact gaps','High','No email address found. Add contact details at the top.');
  if(!r.P.phone) add('Contact gaps','High','No phone number found. Add it at the top.');
  const n = normalize(r.P.lines.join('\n'));
  RULES.buzzwords.forEach(bw => { if(countOcc(n, normalize(bw).trim()) > 0){ const line = r.P.lines.find(l => l.toLowerCase().includes(bw)); add('Buzzwords','Low',`“${bw}” is a claim without proof. Replace it with a result that shows it.`, line); } });
  // industry rules
  if(pack.languages && !('languages' in r.P.sections)) add('Languages','High',`${pack.label} employers screen for languages. Add a “Languages” section with your level in each.`);
  if(pack.photo) add('Photo','Low',`Some ${pack.label.toLowerCase()} roles ask for a photo, but photos hurt ATS parsing. Keep two versions: an ATS version without a photo and a direct-apply version with one.`);
  if(!r.certs.some(c => c.found)) add('Certifications','High',`No ${pack.label.toLowerCase()} certification detected. If you hold one (${r.certs.map(c=>c.label).slice(0,3).join(', ')}), add a “Certifications” section.`);
  const outcomeRe = new RegExp('\\b(' + pack.outcome.join('|') + ')\\b','i');
  bl.filter(b => !outcomeRe.test(b.text)).slice(0, 3).forEach(b => add('Customer outcome','Medium','No guest, passenger or client result in this bullet. Say who benefited and how.', b.text));
  if(pack.safety && !r.safetyFound.length) add('Safety and compliance','High',`No safety or compliance terms found. ${pack.label} roles screen for them — mention drills, audits or certificates you hold.`);
  if(pack.mobility && (!S.profile.passport || !S.profile.relocation)) add('Mobility','Low','Add passport validity and relocation willingness in Settings → Profile. Emails for this pack use them.');
  const order = {High:0, Medium:1, Low:2};
  return out.sort((a,b) => order[a.prio] - order[b.prio]);
}

/* ---------- file extraction (pdf.js / mammoth, loaded on demand from lib/) ---------- */
const loaded = {};
function loadScript(src){
  if(loaded[src]) return loaded[src];
  loaded[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { loaded[src] = null; rej(new Error('Could not load ' + src + '. Keep the lib folder next to index.html.')); }; document.head.appendChild(s); });
  return loaded[src];
}
async function readPdf(file){
  await loadScript('lib/pdf.min.js');
  await loadScript('lib/pdf.worker.min.js'); // defines globalThis.pdfjsWorker so pdf.js runs on the main thread under file://
  const lib = window.pdfjsLib;
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  let text = '', colLines = 0, totLines = 0, images = false;
  for(let p=1; p<=doc.numPages; p++){
    const page = await doc.getPage(p);
    const vw = page.getViewport({scale:1}).width;
    const tc = await page.getTextContent();
    const rows = new Map();
    tc.items.forEach(it => { if(!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5]/3); if(!rows.has(y)) rows.set(y, []); rows.get(y).push({x:it.transform[4], w:it.width, s:it.str}); });
    Array.from(rows.keys()).sort((a,b) => b-a).forEach(y => {
      const r = rows.get(y).sort((a,b) => a.x-b.x);
      let line = '', last = null, gapped = false;
      r.forEach(it => { if(last){ const gap = it.x - (last.x + last.w); if(gap > vw*.12) gapped = true; line += gap > 1.5 ? ' ' : ''; } line += it.s; last = it; });
      totLines++; if(gapped) colLines++;
      text += line.trim() + '\n';
    });
    if(p <= 2){
      try { const ops = await page.getOperatorList(); if(ops.fnArray.some(f => f === lib.OPS.paintImageXObject || f === lib.OPS.paintInlineImageXObject || f === lib.OPS.paintJpegXObject)) images = true; } catch(e) {}
    }
  }
  if(text.replace(/\s/g,'').length < 40) throw new Error('This PDF has no selectable text (it may be a scan). Paste the text instead.');
  return {text, meta:{source:'pdf', pages:doc.numPages, columns: totLines > 8 && colLines/totLines > .25, images}};
}
async function readDocx(file){
  await loadScript('lib/mammoth.browser.min.js');
  const buf = await file.arrayBuffer();
  const out = await window.mammoth.convertToHtml({arrayBuffer: buf});
  const html = out.value;
  const div = document.createElement('div');
  div.innerHTML = html.replace(/<img[^>]*>/g,'');
  div.querySelectorAll('li').forEach(li => li.insertAdjacentText('afterbegin','• '));
  div.querySelectorAll('p,li,h1,h2,h3,h4,h5,h6,tr').forEach(el => el.insertAdjacentText('afterend','\n'));
  div.querySelectorAll('td,th').forEach(el => el.insertAdjacentText('afterend',' | '));
  const text = div.textContent.replace(/\n{3,}/g,'\n\n');
  return {text, meta:{source:'docx', tables:/<table/i.test(html), images:/<img/i.test(html)}};
}
async function readFile(file){
  const n = file.name.toLowerCase();
  if(n.endsWith('.pdf')) return readPdf(file);
  if(n.endsWith('.docx')) return readDocx(file);
  if(n.endsWith('.txt') || n.endsWith('.md')) return {text: await file.text(), meta:{source:'txt'}};
  throw new Error('Use a PDF, DOCX or TXT file. Old .doc files need saving as .docx first.');
}

/* ---------- reply parsing ---------- */
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseReply(text){
  const low = ' ' + text.toLowerCase().replace(/\s+/g,' ') + ' ';
  const hits = {};
  for(const g in REPLY_GROUPS) hits[g] = REPLY_GROUPS[g].filter(k => low.includes(k));
  let status = 'Replied';
  const order = ['Rejected','Offer','Interview'];
  let best = 0;
  order.forEach(g => { if(hits[g].length > best){ best = hits[g].length; status = g; } });
  return {status, hits, dates: findDates(text)};
}
function findDates(text){
  const out = []; const now = new Date(); const y0 = now.getFullYear();
  const push = (d, label) => { if(isNaN(d)) return; if(d < new Date(now.getTime() - 30*864e5) && !/\d{4}/.test(label)) d.setFullYear(d.getFullYear()+1); const v = iso(d); if(!out.some(o => o.iso === v)) out.push({iso:v, label}); };
  const mon = '(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\\.?';
  let m;
  const r1 = new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?' + mon + '(?:,?\\s+(\\d{4}))?','gi');
  while((m = r1.exec(text))) push(new Date(+(m[3]||y0), MONTHS.indexOf(m[2].slice(0,3).toLowerCase()), +m[1], 12), m[0]);
  const r2 = new RegExp('\\b' + mon + '\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?','gi');
  while((m = r2.exec(text))) push(new Date(+(m[3]||y0), MONTHS.indexOf(m[1].slice(0,3).toLowerCase()), +m[2], 12), m[0]);
  const r3 = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  while((m = r3.exec(text))) push(new Date(+m[1], +m[2]-1, +m[3], 12), m[0]);
  const r4 = /\b(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})\b/g;
  while((m = r4.exec(text))){ const yy = +m[3] < 100 ? 2000 + +m[3] : +m[3]; push(new Date(yy, +m[2]-1, +m[1], 12), m[0]); }
  if(/\btomorrow\b/i.test(text)) push(new Date(now.getTime() + 864e5), 'tomorrow');
  const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const r5 = /\b(next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/gi;
  while((m = r5.exec(text))){ const target = days.indexOf(m[2].toLowerCase()); let diff = (target - now.getDay() + 7) % 7 || 7; if(m[1]) diff += diff < 7 ? 0 : 0; push(new Date(now.getTime() + diff*864e5), m[0]); }
  const tm = text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i) || text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  const time = tm ? tm[0] : '';
  return out.map(o => Object.assign(o, {time}));
}

function gaugeSVG(score, opts={}){
  const size = 220, cx = 110, cy = 112, r = 86, a0 = 135, sweep = 270;
  const pt = (ang, rad) => { const t = (ang-90) * Math.PI/180; return [cx + rad*Math.cos(t), cy + rad*Math.sin(t)]; };
  const arc = (from, to, rad) => { const [x1,y1] = pt(from, rad), [x2,y2] = pt(to, rad); const large = (to-from) > 180 ? 1 : 0; return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${rad} ${rad} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; };
  const len = 2*Math.PI*r*(sweep/360);
  let ticks = '';
  for(let i=0;i<=10;i++){ const ang = a0 + sweep*i/10; const [x1,y1] = pt(ang, r+14), [x2,y2] = pt(ang, r+(i%5===0?22:18)); ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--line-2)" stroke-width="${i%5===0?2:1.2}"/>`; if(i%5===0){ const [tx,ty] = pt(ang, r+34); ticks += `<text x="${tx.toFixed(1)}" y="${(ty+4).toFixed(1)}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" fill="var(--ink-3)">${i*10}</text>`; } }
  const bands = [[0,50,'var(--bad)'],[50,75,'var(--warn)'],[75,100,'var(--good)']].map(([f,t,c]) => `<path d="${arc(a0+sweep*f/100+0.8, a0+sweep*t/100-0.8, r+9)}" stroke="${c}" stroke-width="3" fill="none" opacity=".55"/>`).join('');
  const off = len * (1 - score/100);
  return `<svg viewBox="-14 -14 248 238" role="img" aria-label="ATS score ${score} out of 100">
    ${ticks}${bands}
    <path d="${arc(a0, a0+sweep, r)}" stroke="var(--well)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path class="g-fill" d="${arc(a0, a0+sweep, r)}" stroke="${band(score)}" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)}" stroke-dashoffset="${opts.animate ? len.toFixed(1) : off.toFixed(1)}" data-off="${off.toFixed(1)}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/>
    <text x="${cx}" y="${cy+8}" text-anchor="middle" font-family="var(--f-display)" font-weight="800" font-size="58" fill="var(--ink)" class="num">${score}</text>
    <text x="${cx}" y="${cy+34}" text-anchor="middle" font-family="var(--f-mono)" font-size="11" letter-spacing="1.5" fill="var(--ink-2)">ATS MATCH / 100</text>
    <text x="${cx}" y="${cy+82}" text-anchor="middle" font-family="var(--f-body)" font-weight="700" font-size="14" fill="${band(score)}">${bandWord(score)}</text>
  </svg>`;
}
function animateGauges(root){ requestAnimationFrame(() => requestAnimationFrame(() => $$('.g-fill', root).forEach(p => p.setAttribute('stroke-dashoffset', p.dataset.off)))); }

function ringSVG(parts, total, label){
  // parts: [{v (0..1), w (points), color}], drawn as segments of a 300° ring scaled by points
  const cx = 85, cy = 85, r = 66, C = 2*Math.PI*r;
  let acc = 0; const gap = 4;
  const sum = parts.reduce((s,p) => s + p.w, 0);
  const segs = parts.map(p => {
    const segLen = C * p.w/sum - gap;
    const base = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--well)" stroke-width="14" stroke-dasharray="${segLen.toFixed(1)} ${(C-segLen).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    const fillLen = Math.max(0, segLen * p.v);
    const fill = fillLen > 0 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.color}" stroke-width="14" stroke-dasharray="${fillLen.toFixed(1)} ${(C-fillLen).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>` : '';
    acc += C * p.w/sum;
    return base + fill;
  }).join('');
  return `<svg viewBox="0 0 170 170" role="img" aria-label="${esc(label)} ${total} out of 100" style="width:100%;max-width:170px;height:auto;display:block">${segs}
    <text x="85" y="88" text-anchor="middle" font-family="var(--f-display)" font-weight="800" font-size="40" fill="var(--ink)">${total}</text>
    <text x="85" y="108" text-anchor="middle" font-family="var(--f-mono)" font-size="9.5" letter-spacing="1.4" fill="var(--ink-2)">${esc(label.toUpperCase())}</text></svg>`;
}

function timerSVG(left, total){
  const r = 80, C = 2*Math.PI*r, frac = total ? left/total : 0;
  const col = frac > .5 ? 'var(--accent)' : frac > .2 ? 'var(--warn)' : 'var(--bad)';
  const mm = Math.floor(left/60), ss = String(left%60).padStart(2,'0');
  return `<svg viewBox="0 0 200 200" style="width:100%;max-width:200px;height:auto;display:block" role="img" aria-label="${left} seconds left">
    <circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--well)" stroke-width="12"/>
    <circle cx="100" cy="100" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 100 100)"/>
    <text x="100" y="110" text-anchor="middle" font-family="var(--f-mono)" font-weight="700" font-size="38" fill="var(--ink)">${mm}:${ss}</text>
    <text x="100" y="134" text-anchor="middle" font-family="var(--f-mono)" font-size="10" letter-spacing="1.5" fill="var(--ink-3)">REMAINING</text></svg>`;
}

const pk = () => S.profile.industry || 'hospitality';
const P_ = () => PACKS[pk()];
function lastActivity(a){ const ds = a.timeline.map(t => t.date).filter(Boolean); if(a.dateApplied) ds.push(a.dateApplied); return ds.sort().pop() || ''; }
function isGhostRisk(a){ const la = lastActivity(a); return ['Applied','Replied'].includes(a.status) && la && daysBetween(la, today()) >= S.settings.ghostedDays; }
function dueItems(){
  const t = today(), out = [];
  S.applications.forEach(a => {
    if(END.includes(a.status)) return;
    if(a.nextAction && a.nextAction.date && a.nextAction.date <= addDays(t, 3)) out.push({a, date:a.nextAction.date, text:a.nextAction.text || 'Next step'});
    else if(a.status === 'Applied' && a.dateApplied){
      const la = lastActivity(a);
      if(daysBetween(la, t) >= S.settings.followUpDays) out.push({a, date:addDays(la, S.settings.followUpDays), text:'Follow-up due (no reply)'});
    }
  });
  return out.sort((x,y) => x.date.localeCompare(y.date));
}
function resumeById(id){ return S.resumes.find(r => r.id === id); }
let analysisCache = {key:'', res:null};
function currentAnalysis(){
  const r = resumeById(S.check.resumeId);
  if(!r || !S.check.jd.trim()) return null;
  const key = r.id + '|' + r.text.length + '|' + S.check.jd.length + '|' + pk() + '|' + S.check.jd.slice(0,80) + '|' + r.text.slice(0,40);
  if(analysisCache.key !== key) analysisCache = {key, res: analyze(r, S.check.jd, pk())};
  return analysisCache.res;
}
function topSkills(n=3){ const a = currentAnalysis(); if(!a || !a.matched.length) return ''; const s = a.matched.slice(0,n).map(k => k.term); return s.length > 1 ? s.slice(0,-1).join(', ') + ' and ' + s[s.length-1] : s[0]; }
function proofCandidates(){
  const r = resumeById(S.check.resumeId) || S.resumes[0];
  if(!r) return [];
  return parseResume(r.text).bullets.filter(b => RULES.numberRe.test(b.text)).map(b => b.text.replace(/\.$/,'')).slice(0, 5);
}
function prepFor(appId){
  if(appId && appId !== 'general'){ const a = S.applications.find(x => x.id === appId); if(a){ a.prep = a.prep || {star:{},checklist:{},mocks:[],research:''}; return a.prep; } }
  return S.prep.general;
}
function questionSet(appId){
  const a = S.applications.find(x => x.id === appId);
  const qs = [];
  const add = (cat, list) => list.forEach((q, i) => qs.push({id: cat + i, cat, q}));
  add('General', QUESTIONS.general);
  add('Behavioural', QUESTIONS.behavioural);
  add(P_().label, QUESTIONS[pk()]);
  const jd = a && a.jdText ? a.jdText : (S.check.jd || '');
  if(jd.trim()){
    const r = resumeById(a && a.resumeId || S.check.resumeId);
    const kws = extractKeywords(jd, pk()).slice(0, 8);
    const nres = r ? normalize(r.text) : '';
    kws.slice(0, 6).forEach((k, i) => {
      const have = nres && countOcc(nres, k.term) > 0;
      qs.push({id:'jd-' + k.term.replace(/\W+/g,'_'), cat:'From the job ad', q: have ? `Walk me through a time you used ${k.term}.` : `The role asks for ${k.term}. How would you get up to speed quickly?`});
    });
  }
  return qs;
}
function readiness(appId){
  const a = S.applications.find(x => x.id === appId);
  const p = prepFor(appId);
  const stars = Object.values(p.star||{}).filter(s => starComplete(s)).length;
  const items = (CHECKLISTS[pk()]||[]).concat(CHECK_GENERAL);
  const done = items.filter((_, i) => p.checklist && p.checklist[i]).length;
  const ats = a && a.atsScore ? a.atsScore : (currentAnalysis() ? currentAnalysis().score : 0);
  const parts = [
    {k:'Resume match', v: clamp(ats/100,0,1), w:25, color:'var(--s1)', d:`ATS ${ats||'—'}`},
    {k:'STAR stories', v: clamp(stars/6,0,1), w:25, color:'var(--s2)', d:`${stars} of 6 written`},
    {k:'Mock interviews', v: clamp((p.mocks||[]).length/3,0,1), w:20, color:'var(--s3)', d:`${(p.mocks||[]).length} of 3 done`},
    {k:'Assessment checklist', v: items.length ? done/items.length : 0, w:20, color:'var(--s4)', d:`${done} of ${items.length} ticked`},
    {k:'Company research', v: clamp((p.research||'').trim().length/200,0,1), w:10, color:'var(--s5)', d:(p.research||'').trim().length >= 200 ? 'Done' : 'Add notes'}
  ];
  const total = Math.round(parts.reduce((s,x) => s + x.v*x.w, 0));
  return {parts, total};
}
function starComplete(s){ return s && ['s','t','a','r'].every(k => (s[k]||'').trim().length >= 12); }

  box.innerHTML = `<span class="tag">NEXT</span><div class="flap" aria-label="${esc(b.txt)}">${target.split('').map(c => c===' ' ? '<span class="sp"> </span>' : `<span>${esc(c)}</span>`).join('')}</div><span class="status ${b.late?'late':''}">${b.status}</span>`;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!anim || reduce) return;
  const cells = $$('.flap span:not(.sp)', box); const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const finals = cells.map(c => c.textContent);
  let tick = 0; clearInterval(flapTimer);
  flapTimer = setInterval(() => {
    tick++;
    cells.forEach((c, i) => { c.textContent = tick > 4 + i*0.35 ? finals[i] : chars[(Math.random()*chars.length)|0]; });
    if(tick > 6 + cells.length*0.35){ clearInterval(flapTimer); cells.forEach((c,i) => c.textContent = finals[i]); }
  }, 45);
}

function vDashboard(){
  const A = S.applications;
  const reached = PIPE.map((_, i) => A.filter(a => (a.maxStage ?? PIPE.indexOf(a.status)) >= i).length);
  const applied = reached[1], replied = reached[2], interview = reached[3], offers = reached[4];
  const active = A.filter(a => !END.includes(a.status)).length;
  const rate = (a, b) => b ? Math.round(a/b*100) : 0;
  const avg = list => list.length ? Math.round(list.reduce((s,a) => s + a.atsScore, 0)/list.length) : 0;
  const scored = A.filter(a => a.atsScore > 0);
  const atsInt = avg(scored.filter(a => (a.maxStage ?? 0) >= 3));
  const atsRej = avg(scored.filter(a => a.status === 'Rejected' || a.status === 'Ghosted'));
  const due = dueItems();
  const name = (S.profile.name||'').split(' ')[0];

  // route graphic
  const W = 760, H = 170, x0 = 60, x1 = W - 60, step = (x1 - x0)/(PIPE.length-1), maxN = Math.max(1, ...reached);
  let route = `<line x1="${x0}" y1="70" x2="${x1}" y2="70" stroke="var(--line-2)" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>`;
  const lastReached = reached.reduce((m, n, i) => n > 0 ? i : m, 0);
  route += `<line x1="${x0}" y1="70" x2="${x0 + step*lastReached}" y2="70" stroke="var(--accent)" stroke-width="3"/>`;
  PIPE.forEach((st, i) => {
    const x = x0 + step*i, n = reached[i], rr = 10 + 16*Math.sqrt(n/maxN);
    if(i > 0){ const conv = rate(reached[i], reached[i-1]); route += `<text x="${x - step/2}" y="58" text-anchor="middle" font-family="var(--f-mono)" font-size="11" fill="var(--ink-3)">${reached[i-1] ? conv + '%' : ''}</text>`; }
    route += `<circle cx="${x}" cy="70" r="${rr.toFixed(1)}" fill="${n ? 'var(--accent)' : 'var(--surface)'}" stroke="${n ? 'var(--accent)' : 'var(--line-2)'}" stroke-width="2"/>`;
    route += `<text x="${x}" y="${70 + 5}" text-anchor="middle" font-family="var(--f-display)" font-weight="800" font-size="15" fill="${n ? 'var(--accent-ink)' : 'var(--ink-3)'}">${n}</text>`;
    route += `<text x="${x}" y="${120}" text-anchor="middle" font-family="var(--f-mono)" font-size="11" letter-spacing="1.2" fill="var(--ink-2)">${st.toUpperCase()}</text>`;
    route += `<text x="${x}" y="${138}" text-anchor="middle" font-family="var(--f-body)" font-size="11" fill="var(--ink-3)">${A.filter(a => a.status === st).length} here now</text>`;
  });
  // plane at the furthest stage
  const px = x0 + step*lastReached;
  route += `<g transform="translate(${px} 30) rotate(90)"><path d="M0 -11 L3 -3 L11 2 L11 4 L3 2 L2 8 L5 10 L5 11 L0 10 L-5 11 L-5 10 L-2 8 L-3 2 L-11 4 L-11 2 L-3 -3 Z" fill="var(--brass)"/></g>`;

  // weekly activity
  const weeks = 8, wk = []; const t = today();
  for(let i=weeks-1;i>=0;i--){ const end = addDays(t, -7*i), start = addDays(end, -6); wk.push({start, n: A.filter(a => a.dateApplied && a.dateApplied >= start && a.dateApplied <= end).length}); }
  const wmax = Math.max(2, ...wk.map(w => w.n));
  const bw = 34, bg = 14, WH = 120;
  const wsvg = `<svg viewBox="0 0 ${weeks*(bw+bg)+20} ${WH+34}" style="width:100%;height:auto;display:block" role="img" aria-label="Applications per week">
    ${[0, .5, 1].map(f => `<line x1="20" x2="${weeks*(bw+bg)+20}" y1="${(WH - f*(WH-14)).toFixed(1)}" y2="${(WH - f*(WH-14)).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="14" y="${(WH - f*(WH-14) + 4).toFixed(1)}" text-anchor="end" font-family="var(--f-mono)" font-size="9" fill="var(--ink-3)">${Math.round(f*wmax)}</text>`).join('')}
    ${wk.map((w,i) => { const h = (w.n/wmax)*(WH-14); const x = 26 + i*(bw+bg); return `<rect x="${x}" y="${(WH-h).toFixed(1)}" width="${bw}" height="${Math.max(h,0).toFixed(1)}" rx="4" fill="${i===weeks-1 ? 'var(--brass)' : 'var(--accent)'}" opacity="${i===weeks-1?1:.8}"/>${w.n ? `<text x="${x+bw/2}" y="${(WH-h-5).toFixed(1)}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" font-weight="600" fill="var(--ink)">${w.n}</text>` : ''}<text x="${x+bw/2}" y="${WH+16}" text-anchor="middle" font-family="var(--f-mono)" font-size="9" fill="var(--ink-3)">${fmtDate(w.start)}</text>`; }).join('')}
  </svg>`;

  const atsBar = (label, v, col) => `<div class="bar"><div class="lbl"><b>${label}</b><span class="mono num">${v || '—'}</span></div><div class="track"><div class="fill" style="width:${v}%;background:${col}"></div></div></div>`;

  return `
  <div class="pagehead"><div class="grow"><div class="eyebrow">${esc(P_().label)} · ${esc(S.profile.role||'')}</div><h1>${name ? 'Good to see you, ' + esc(name) + '.' : 'Your job hunt at a glance'}</h1>
  <p>${due.filter(d => d.date <= today()).length ? `${due.filter(d => d.date <= today()).length} thing${due.filter(d => d.date <= today()).length>1?'s':''} need you today.` : 'Nothing overdue.'} ${active} active application${active===1?'':'s'}, ${offers} offer${offers===1?'':'s'} so far.</p></div>
  <div class="row"><button class="btn" data-nav="resume">${ico('resume')}Check a resume</button><button class="btn" data-nav="outreach">${ico('mail')}Write outreach</button></div></div>

  <div class="grid g4">
    <div class="panel kpi"><span class="eyebrow">Active</span><span class="v num">${active}</span><span class="s">of ${A.length} tracked</span></div>
    <div class="panel kpi"><span class="eyebrow">Reply rate</span><span class="v num">${rate(replied, applied)}%</span><span class="s">${replied} replies from ${applied} applied</span></div>
    <div class="panel kpi"><span class="eyebrow">Interview rate</span><span class="v num">${rate(interview, applied)}%</span><span class="s">${interview} reached interview</span></div>
    <div class="panel kpi"><span class="eyebrow">Offers</span><span class="v num" style="color:var(--good)">${offers}</span><span class="s">${rate(offers, interview)}% of interviews</span></div>
  </div>

  <div class="panel route">
    <div class="panel-h"><h2>Flight path</h2><span class="muted grow">How far your applications got. Percentages show the hop from one stage to the next.</span>
      <span class="chips">${END.map(e => `<span class="pill st-${e}">${e} ${A.filter(a => a.status===e).length}</span>`).join('')}</span></div>
    <div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" style="min-width:520px" role="img" aria-label="Pipeline: ${PIPE.map((p,i)=>p+' '+reached[i]).join(', ')}">${route}</svg></div>
  </div>

  <div class="grid g2">
    <div class="panel today">
      <div class="panel-h"><h2>Today and next 3 days</h2><span class="grow"></span><button class="btn sm ghost" data-nav="applications">All applications</button></div>
      ${due.length ? `<ul>${due.slice(0,7).map(d => { const late = d.date < today(); const dd = new Date(d.date+'T12:00:00'); return `<li><div class="datebox ${late?'late':''}"><b class="num">${dd.getDate()}</b><i>${late ? 'LATE' : dd.toLocaleDateString(undefined,{month:'short'}).toUpperCase()}</i></div><div style="flex:1;min-width:0"><b>${esc(d.text)}</b><div class="muted" style="font-size:.85rem">${esc(d.a.company)} · ${esc(d.a.role)}</div></div><button class="btn sm" data-open="${d.a.id}">Open</button></li>`; }).join('')}</ul>` : `<div class="empty">Nothing due. Add a next action to any application and it shows up here.</div>`}
    </div>
    <div class="stack">
      <div class="panel">
        <div class="panel-h"><h2>Does the ATS score matter?</h2></div>
        <div class="bars">${atsBar('Got an interview', atsInt, 'var(--good)')}${atsBar('Rejected or ghosted', atsRej, 'var(--bad)')}</div>
        <p class="note" style="margin-top:10px">Average ATS score of scored applications in each group. ${atsInt && atsRej ? (atsInt > atsRej ? `Interviews scored ${atsInt-atsRej} points higher on average.` : 'No clear gap yet.') : 'Score more applications to compare.'}</p>
      </div>
      <div class="panel">
        <div class="panel-h"><h2>Applications per week</h2><span class="muted">last 8 weeks</span></div>
        ${wsvg}
      </div>
    </div>
  </div>`;
}

function resultsHTML(a){
  const pack = PACKS[a.packKey];
  const st = S.suggestionStatus;
  const sugg = a.suggestions.filter(s => ui.suggFilter === 'all' ? true : ui.suggFilter === 'open' ? !st[s.id] : !!st[s.id]);
  const openCount = a.suggestions.filter(s => !st[s.id]).length;
  const sec = ['contact','summary','experience','education','skills','projects','certifications','languages'];
  const hasContact = a.P.email || a.P.phone;
  const tile = (cls, k, v) => `<div class="gaptile ${cls}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const metFound = a.metrics.filter(m => m.found);
  const outcomePct = a.P.bullets.length ? Math.round(a.outcomeBul.length / a.P.bullets.length * 100) : 0;
  return `
  <div class="panel">
    <div class="gaugewrap">
      <div class="gauge">${gaugeSVG(a.score, {animate:true})}</div>
      <div class="stack">
        <div class="panel-h" style="margin:0"><h2>Score breakdown</h2><span class="grow"></span><span class="chip neutral">${esc(pack.label)} pack</span></div>
        <div class="bars">${a.comps.map(c => `<div class="bar"><div class="lbl"><span><b>${c.label}</b> <span class="faint">· ${c.w}%</span></span><span class="muted" style="font-size:.8rem">${esc(c.detail)} · <span class="mono num">${Math.round(c.v*c.w)}/${c.w}</span></span></div><div class="track"><div class="fill" style="width:${Math.round(c.v*100)}%;background:${band(c.v*100)}"></div></div></div>`).join('')}</div>
        <p class="disclaimer">ⓘ This approximates how ATS keyword filters behave. Real ATS tools differ and don’t publish their scores.</p>
      </div>
    </div>
  </div>

  <div class="grid g2">
    <div class="panel">
      <div class="panel-h"><h2>Keywords</h2><span class="muted">${a.matched.length} matched · ${a.missing.length} missing</span></div>
      <div class="eyebrow" style="margin-bottom:8px">Found in your resume</div>
      <div class="chips">${a.matched.map(k => `<span class="chip ok" title="appears ${k.count}× in JD">✓ ${esc(k.term)}${k.req?' <span class="w">REQ</span>':''}</span>`).join('') || '<span class="note">None yet.</span>'}</div>
      <div class="eyebrow" style="margin:16px 0 8px">Missing — add only if you have it</div>
      <div class="chips">${a.missing.map(k => `<span class="chip miss" title="appears ${k.count}× in JD">${esc(k.term)} <span class="w">×${k.count}${k.req?' REQ':''}</span></span>`).join('') || '<span class="note">Nothing missing.</span>'}</div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2>Gap map</h2><span class="muted">${esc(pack.label)} recruiters check these</span></div>
      <div class="eyebrow" style="margin-bottom:8px">Sections</div>
      <div class="gapmap" style="margin-bottom:14px">${sec.map(s => { const on = s==='contact' ? hasContact : (s in a.P.sections); const opt = ['projects','certifications','languages'].includes(s) && !(s==='languages' && pack.languages) && !(s==='certifications'); return tile(on ? 'ok' : opt ? '' : 'miss', SECTION_LABEL[s], on ? 'Found' : opt ? 'Optional' : 'Missing'); }).join('')}</div>
      <div class="eyebrow" style="margin-bottom:8px">Industry evidence</div>
      <div class="gapmap">
        ${tile(a.certs.some(c=>c.found) ? 'ok' : 'miss', 'Certifications', a.certs.filter(c=>c.found).map(c=>esc(c.label)).join(', ') || 'None detected')}
        ${tile(metFound.length >= 2 ? 'ok' : metFound.length ? 'part' : 'miss', 'Industry metrics', metFound.length ? metFound.map(m=>esc(m.label)).join(', ') : 'None — try ' + esc(pack.metrics.slice(0,3).join(', ')))}
        ${tile(outcomePct >= 40 ? 'ok' : outcomePct ? 'part' : 'miss', 'Customer outcomes', `${a.outcomeBul.length}/${a.P.bullets.length} bullets (${outcomePct}%)`)}
        ${tile(a.withNum.length/Math.max(1,a.P.bullets.length) >= .5 ? 'ok' : 'part', 'Quantified bullets', `${a.withNum.length}/${a.P.bullets.length}`)}
        ${pack.safety ? tile(a.safetyFound.length ? 'ok' : 'miss', 'Safety & compliance', a.safetyFound.slice(0,4).map(esc).join(', ') || 'None found') : ''}
        ${pack.languages ? tile('languages' in a.P.sections ? 'ok' : 'miss', 'Languages', 'languages' in a.P.sections ? 'Section found' : 'No section') : ''}
        ${pack.mobility ? tile(S.profile.passport ? 'ok' : 'part', 'Passport & relocation', S.profile.passport ? 'Valid to ' + esc(S.profile.passport) : 'Add in Settings') : ''}

    ${sugg.length ? sugg.map(s => `<div class="sugg ${st[s.id]?'done':''}"><span class="pill prio-${s.prio}">${s.prio}</span><div><div class="eyebrow" style="margin-bottom:3px">${esc(s.rule)}${st[s.id] ? ' · ' + st[s.id] : ''}</div><div class="txt">${esc(s.text)}</div>${s.line ? `<div class="quote">“${esc(s.line.length > 160 ? s.line.slice(0,160)+'…' : s.line)}”</div>` : ''}</div>
      <div class="row" style="flex-wrap:nowrap">${st[s.id] ? `<button class="btn sm ghost" data-sugg="${s.id}" data-v="">Reopen</button>` : `<button class="btn sm" data-sugg="${s.id}" data-v="Done">Done</button><button class="btn sm ghost" data-sugg="${s.id}" data-v="Ignored">Ignore</button>`}</div></div>`).join('') : `<div class="empty">${ui.suggFilter==='open' ? 'All fixes handled. Nice work.' : 'Nothing here.'}</div>`}
  </div>

  ${promptHelperHTML(a)}`;

function promptHelperHTML(a){
  const types = {bullets:'Rewrite my weak bullets', summary:'Tailor my summary', email:'Polish an email draft', reply:'Draft a reply to a recruiter'};
  return `<div class="panel stack">
    <div class="panel-h" style="margin:0"><h2>AI prompt helper</h2><span class="muted grow">Builds a prompt you paste into any chat AI you already use. This app makes no connection.</span></div>
    <div class="tabs" role="tablist">${Object.entries(types).map(([k,v]) => `<button role="tab" aria-selected="${ui.promptType===k}" data-pt="${k}">${v}</button>`).join('')}</div>
    ${ui.promptType === 'email' || ui.promptType === 'reply' ? `<label class="field"><span>${ui.promptType==='email' ? 'Email draft to polish' : 'Recruiter email to reply to'}</span><textarea class="input" id="pt-extra" rows="4">${esc(ui.ptExtra||'')}</textarea></label>` : ''}
    <textarea class="input mono" id="pt-out" rows="9" readonly style="font-size:.78rem">${esc(buildPrompt(a))}</textarea>
    <div class="row"><button class="btn primary" data-action="copy-prompt">${ico('copy')}Copy prompt</button><span class="note">Includes “Do not invent experience or skills.”</span></div>
    <div class="hr"></div>
    <label class="field"><span>Paste the AI’s answer to keep it</span><textarea class="input" id="pt-back" rows="4" placeholder="Paste the answer here"></textarea></label>
    <div class="row"><select class="input" id="pt-app" style="width:auto;max-width:260px" aria-label="Save to application">${S.applications.map(x => `<option value="${x.id}" ${S.check.appId===x.id?'selected':''}>${esc(x.company)} — ${esc(x.role)}</option>`).join('')}</select><button class="btn" data-action="save-ai">Save to application notes</button></div>
  </div>`;
}
function buildPrompt(a){
  const r = resumeById(S.check.resumeId);
  const pack = PACKS[a.packKey];
  const miss = a.missing.slice(0, 12).map(k => k.term).join(', ') || 'none';
  const rule = 'Do not invent experience or skills. Only use what is in my resume. If a missing keyword does not apply to me, leave it out.';
  const jd = S.check.jd.trim();
  if(ui.promptType === 'bullets'){
    const flagged = Array.from(new Set(a.suggestions.filter(s => s.line && ['Weak opening verb','No measurable result','Bullet too long','Customer outcome'].includes(s.rule)).map(s => s.line))).slice(0, 10);
    return `You are an expert ${pack.noun} resume writer.\n\nRewrite these resume bullets for the job description below. Start each with a strong action verb, add a measurable result where my original gives one (use [X] as a placeholder where I need to fill a number), and show the guest, passenger or client outcome. Keep each under 25 words.\n\n${rule}\n\nBULLETS TO REWRITE:\n${flagged.map(b => '- ' + b).join('\n') || '- (no flagged bullets)'}\n\nKEYWORDS MISSING FROM MY RESUME (use only if they truly apply): ${miss}\n\nJOB DESCRIPTION:\n${jd}`;
  }
  if(ui.promptType === 'summary'){
    return `You are an expert ${pack.noun} resume writer.\n\nWrite a 3-sentence professional summary for my resume, tailored to the ${S.profile.role || 'target'} role below. Lead with years of experience and my strongest measurable result.\n\n${rule}\n\nMY RESUME:\n${r ? r.text : ''}\n\nKEYWORDS MISSING FROM MY RESUME: ${miss}\n\nJOB DESCRIPTION:\n${jd}`;
  }
  if(ui.promptType === 'email'){

function fill(tpl, ctx){ return tpl.replace(/\{\{(\w+)\}\}/g, (m, k) => (ctx[k] != null && String(ctx[k]).trim() !== '') ? String(ctx[k]) : m); }
function unfilled(s){ return Array.from(new Set((s.match(/\{\{\w+\}\}/g)||[]))); }

}
function personalChecks(t){
  const body = ui.outBody || '', subj = ui.outSubject || '', ctx = outCtx();
  const wc = (body.match(/\S+/g)||[]).length;
  const asks = (body.match(/\?/g)||[]).length;
  const bw = RULES.buzzwords.filter(b => body.toLowerCase().includes(b));
  const hook = ctx.hook || '';
  const list = [
    {ok: !!ctx.recruiter && !/hiring manager|sir|madam/i.test(ctx.recruiter), t:'Addressed to a named person', tip:'Find the hiring manager on LinkedIn or the company site.'},
    {ok: hook.split(/\s+/).length >= 10 && (ctx.company && hook.toLowerCase().includes(ctx.company.toLowerCase().split(' ')[0]) || /\d|recent|new|launch|award|opened|read|saw|post/i.test(hook)), t:'Hook is specific to them', tip:'Mention something only they did: a new property, route, award, event or post.'},
    {ok: RULES.numberRe.test(ctx.proof_point || ''), t:'Proof point has a number', tip:'Pick a resume bullet with a result.'},
    {ok: t.short ? body.length <= 300 : (wc >= 60 && wc <= 170), t: t.short ? `Under 300 characters (${body.length})` : `60–170 words (${wc})`, tip:'Short emails get read on a phone.'},
    {ok: t.id === 'c4' || (subj.length > 0 && subj.length <= 60), t:`Subject under 60 characters (${subj.length})`, tip:'Lead with the role and a result.'},
    {ok: asks >= 1 && asks <= 2, t:'One clear ask', tip:'End with a single yes/no question.'},
    {ok: !bw.length, t: bw.length ? `Buzzwords: ${bw.join(', ')}` : 'No buzzwords', tip:'Swap claims for evidence.'},
    {ok: !unfilled(subj + body).length, t: unfilled(subj+body).length ? `${unfilled(subj+body).length} placeholder(s) unfilled` : 'All placeholders filled', tip:'Fill the red fields.'}
  ];
  return list;
}

function appsTable(){

  list = list.slice().sort((x,y) => { const a = val(x), b = val(y); return (typeof a === 'number' ? a - b : String(a).localeCompare(String(b))) * dir; });

function setStatus(a, st, note){
  if(a.status === st) return;
  a.status = st;
  const idx = PIPE.indexOf(st);
  if(idx > (a.maxStage ?? 0)) a.maxStage = idx;
  if(st === 'Applied' && !a.dateApplied) a.dateApplied = today();
  a.timeline.push({type:'status_change', date:today(), content: note || ('Status changed to ' + st)});
  if(st === 'Applied' && (!a.nextAction || !a.nextAction.date)) a.nextAction = {text:'Follow up', date:addDays(today(), S.settings.followUpDays)};
}

  });
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-action],[data-open],[data-sugg],[data-sf],[data-pt],[data-q],[data-prept],[data-rate],[data-tpl],[data-proof],[data-mode],[data-sort],[data-deltpl]');
  if(!t) return;
  if(t.dataset.nav){ go(t.dataset.nav); return; }
  if(t.dataset.open && !t.closest('.drawer')){ openApp(t.dataset.open); return; }
  if(t.dataset.sugg !== undefined && t.dataset.sugg){ const v = t.dataset.v; if(v) S.suggestionStatus[t.dataset.sugg] = v; else delete S.suggestionStatus[t.dataset.sugg]; save(); rerenderKeep(); return; }
  if(t.dataset.sf){ ui.suggFilter = t.dataset.sf; rerenderKeep(); return; }
  if(t.dataset.pt){ ui.promptType = t.dataset.pt; rerenderKeep(); return; }
  if(t.dataset.q){ ui.qSel = t.dataset.q; render(); return; }
  if(t.dataset.prept){ ui.prepTab = t.dataset.prept; render(); return; }
  if(t.dataset.rate){ ui.mock.ratings[ui.mock.i] = +t.dataset.rate; const n = $('#mk-note'); if(n) ui.mock.notes[ui.mock.i] = n.value; render(); return; }
  if(t.dataset.tpl){ ui.outTpl = t.dataset.tpl; ui.outDirty = false; ui.confirm = null; render(); return; }
  if(t.dataset.proof){ ui.outFields.proof_point = t.dataset.proof; ui.outDirty = false; render(); return; }
  if(t.dataset.mode){ ui.appsMode = t.dataset.mode; render(); return; }
  if(t.dataset.sort){ const k = t.dataset.sort; ui.sort = {k, dir: ui.sort.k === k ? -ui.sort.dir : 1}; render(); return; }
  if(t.dataset.deltpl){ S.templates = S.templates.filter(x => x.id !== t.dataset.deltpl); save(); render(); return; }
  const act = t.dataset.action;
  const A = actions[act]; if(A){ if(act !== 'mailto') e.preventDefault(); A(e, t); }
});
function rerenderKeep(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
