  <div class="pillars" style="--c:${col}">${M.pillars.map(p => `<div class="card"><h4>${esc(p[0])}</h4><p class="small">${esc(p[1])}</p><div class="say">${esc(p[2])}</div></div>`).join('')}</div>
  <p class="small"><b>Tone:</b> ${esc(M.tone)}</p>
  <h2>Tactics and touchpoints</h2>
  <table><tbody>${M.tactics.map(t => `<tr><td class="k" style="width:52mm">${esc(t[0])}</td><td>${esc(t[1])}</td></tr>`).join('')}</tbody></table>
  <h2>The workflow</h2>
  <p>${c.steps.length} steps, from ${esc(c.steps[0].t.toLowerCase())} to ${esc(c.steps[c.steps.length - 1].t.toLowerCase())}. Each box is one step in the column of the team that owns it; gold tags are yes/no checkpoints.</p>
  ${vswim({lanes:c.lanes, steps:c.steps}, col, `${c.n} · ${c.name} workflow · one column per team`)}
  <h3>Each step, defined</h3>
  ${stepTable(c.steps, c.lanes, true)}
  <h2>${c.id === 'internal' ? 'The path from strategy to execution' : 'Lead flow'}</h2>
  <p>${c.id === 'internal' ? 'Internal work moves from strategy to a written record. The measures between stages show where it slows down.' : 'The stages people or partners move through in this channel, with the conversion measured between each. A weak conversion shows which workflow step to fix first.'}</p>
  ${lflow(c)}
  <h2>KPIs and how they are calculated</h2>
  <table><thead><tr><th style="width:40mm">KPI</th><th>Formula</th><th style="width:18mm">How often</th><th style="width:14mm">Type</th><th style="width:28mm">Owner</th></tr></thead><tbody>
  ${c.kpi.map(k => `<tr><td class="k">${esc(k[0])}<div class="faint small" style="font-weight:400">${esc(KX[k[0]].w)}</div></td><td class="f">${esc(fText(KX[k[0]]))}</td><td>${esc(k[3])}</td><td><span class="pill ${k[6] === 'Leading' ? 'lead' : 'lag'}">${k[6]}</span></td><td>${esc(k[4])}</td></tr>`).join('')}</tbody></table>
  <div class="cols2 avoid">
    <div class="card soft"><h4>Worked example</h4><p class="small">${X.story}</p></div>
    <div class="card"><h4>Rules that keep it working</h4><ul class="small">${X.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      <h4 style="margin-top:2mm">Warning signs</h4><ul class="small">${X.breaks.map(b => `<li><b style="color:var(--bad)">${esc(b[0])}:</b> ${esc(b[1])}</li>`).join('')}</ul></div>
  </div>
  <table><tbody>
    <tr><td class="k" style="width:34mm">Comes in from</td><td>${c.in.map(x => `<b>${esc(x[0])}:</b> ${esc(x[1])}`).join(' · ')}</td></tr>
    <tr><td class="k">Hands off to</td><td>${c.hand.map(x => `<b>${esc(x[0])}:</b> ${esc(x[1])}`).join(' · ')}</td></tr>
    <tr><td class="k">Review rhythm</td><td>${c.cad.map(esc).join(' · ')}</td></tr>
  </tbody></table>
  ${c.id === 'internal' ? `<h2>The twelve internal streams</h2>
  <table><thead><tr><th style="width:38mm">Stream</th><th>Covers</th><th style="width:28mm">How often</th><th style="width:24mm">Runs it</th></tr></thead><tbody>${STREAMS.map(s => `<tr><td class="k">${esc(s[0])}</td><td>${esc(s[1])}</td><td>${esc(s[3])}</td><td>${esc(s[4])}</td></tr>`).join('')}</tbody></table>
  <h2>Crisis and escalation</h2>
  <p>${ESC.map((e, i) => `<span class="tag" style="background:${i < 3 ? 'var(--bad-soft)' : i < 6 ? 'var(--warm-soft)' : 'var(--accent-soft)'}; color:${i < 3 ? 'var(--bad)' : i < 6 ? 'var(--warm)' : 'var(--accent-ink)'}">${i + 1} ${esc(e)}</span>`).join(' ')}</p>
  <table><thead><tr><th>Level</th><th>For example</th><th>Answer within</th><th>Escalate to</th><th>Who is told</th><th>Updates</th></tr></thead><tbody>${SEV.map(r => `<tr><td class="k">${esc(r[0])}</td>${r.slice(1).map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>` : ''}`);
  out.push(endCh);
});

/* 9 new workflows */
out.push(chapter('New cross-channel workflows', 'The seven channel workflows cover what each team does. Some work crosses every channel and had no defined path in the plan: capturing leads, launching campaigns, running referrals, handling reviews, fixing problems, managing consent and approving promotions. Each is defined here the same way, with a swimlane, step definitions and KPIs.', {ey:'Workflows W1–W7 · added'}));
out.push(`<table><thead><tr><th style="width:10mm">#</th><th style="width:50mm">Workflow</th><th>Serves</th></tr></thead><tbody>
${NEWFLOW.map(w => `<tr><td class="mono">${w.n}</td><td class="k">${esc(w.name)}</td><td>${w.serves.map(esc).join(' · ')}</td></tr>`).join('')}
<tr><td class="mono">W8</td><td class="k">Business trip</td><td>Corporate travel chapter</td></tr><tr><td class="mono">W9</td><td class="k">MICE event</td><td>Corporate travel chapter</td></tr>
<tr><td class="mono">S1–S3</td><td class="k">Sales cycles: properties, agencies, enquiries</td><td>Sales lifecycles chapter</td></tr></tbody></table>`);
NEWFLOW.forEach((w, i) => {
  out.push(`<div style="${i ? 'break-before:page' : ''}"><h2 data-toc-sub="${esc(w.n + ' ' + w.name)}">${w.n} · ${esc(w.name)}</h2>
  <p>${esc(w.why)}</p>
  <p class="small"><b>Serves:</b> ${w.serves.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</p>
  ${WF_BENCH[w.id] ? `<p class="small muted"><b style="color:var(--accent-ink)">Benchmark:</b> ${esc(WF_BENCH[w.id])}</p>` : ''}
  ${vswim(w, '#0e5b5e', `${w.n} · ${w.name} · one column per team`)}
  ${stepTable(w.steps, w.lanes)}
  <h3>KPIs</h3>
  <table><tbody>${w.kpi.map(k => `<tr><td class="k" style="width:52mm">${esc(k[0])}</td><td class="f">${esc(k[1])}</td></tr>`).join('')}</tbody></table></div>`);
});
out.push(endCh);

/* 10 operating model */
out.push(chapter('The operating model', 'How the seven channels and nine new workflows are run week to week: who is accountable, when the team meets, and what happens when something goes wrong.', {ey:'Operating model'}));
out.push(`<h2>Who owns what</h2>
<p class="small">A = accountable (one per channel, signs off) · R = does the work · C = asked before · I = told after</p>
<table><thead><tr><th>Channel</th>${ROLES.map(r => `<th style="font-size:5.6pt; letter-spacing:.02em">${esc(r)}</th>`).join('')}</tr></thead><tbody>
${CH.map(c => `<tr><td class="k" style="white-space:nowrap">${c.n} ${esc(short(c))}</td>${RACI[c.id].map(x => `<td style="text-align:center"><span class="raci ${x}">${x}</span></td>`).join('')}</tr>`).join('')}</tbody></table>
<h2>Meeting rhythm</h2>
<table><thead><tr><th style="width:30mm">When</th><th>What</th><th style="width:40mm">Who</th></tr></thead><tbody>
<tr><td class="k">Daily</td><td>Operational check-ins where required; India → Canada handoff note at 6 pm IST</td><td>Operations, region leads</td></tr>
<tr><td class="k">Monday</td><td>Dashboard published; weekly management review</td><td>Finance; function heads</td></tr>
<tr><td class="k">Tue – Fri</td><td>Functional meetings: marketing &amp; social, supply pipeline, creator content, destination offers, tech &amp; product, finance, customer service &amp; BD</td><td>Each function head</td></tr>
<tr><td class="k">Monthly</td><td>Strategic / business review; investor update; partner statements</td><td>Executive team</td></tr>
<tr><td class="k">Quarterly</td><td>Partner, creator and sponsor reviews; message house review; consent and data review; KPI targets reset</td><td>Account managers, communications, legal</td></tr>
</tbody></table>
<h2>Handoffs across time zones</h2>
<table><thead><tr><th>India (IST)</th><th>Canada Eastern</th><th>Philippines</th><th>What happens</th></tr></thead><tbody>
<tr><td class="mono">6:00 pm</td><td class="mono">8:30 am EDT (from 1 Nov: 7:00 pm IST = 8:30 am EST)</td><td class="mono">8:30 pm</td><td>India hands over to Canada</td></tr>
<tr><td class="mono">3:30 am</td><td class="mono">6:00 pm EDT</td><td class="mono">6:00 am</td><td>Canada closes with its handoff note</td></tr>
<tr><td class="mono">9:30 am</td><td class="mono">12:00 am EDT</td><td class="mono">12:00 pm</td><td>India and the Philippines start from Canada’s note</td></tr></tbody></table>
<p class="note">Assumes the Canada team works Eastern Time.</p>`);
out.push(endCh);

/* 11 measurement */
out.push(chapter('Measurement: every KPI and its formula', 'Sixty-one channel KPIs, each calculated the same way every month from raw counts and amounts, plus the workflow KPIs above. Targets are set from the budget model and reviewed each quarter. The KPI Workspace calculates all of them automatically once the monthly numbers are entered.', {ey:'Measurement'}));
out.push(`<table><thead><tr><th style="width:9mm"></th><th style="width:42mm">KPI</th><th>Formula</th><th style="width:17mm">How often</th><th style="width:13mm">Good</th></tr></thead><tbody>
${CH.map(c => c.kpi.map(k => `<tr><td class="mono" style="color:${COLOR[c.id]}">${c.n}</td><td class="k">${esc(k[0])}</td><td class="f">${esc(fText(KX[k[0]]))}</td><td>${esc(k[3])}</td><td class="mono">${k[5] === 'down' ? '↓ lower' : k[5] === 'hold' ? '= hold' : '↑ higher'}</td></tr>`).join('')).join('')}
</tbody></table>
<h2>Rules for every KPI</h2>
<ul><li>One owner and one data source per KPI.</li><li>Enter raw counts and amounts, never percentages; the formula does the rest.</li><li>Rates that follow people over time are measured by cohort, the month they joined.</li><li>Leading KPIs are managed weekly, lagging KPIs reviewed monthly or quarterly.</li><li>Money is in Indian rupees; periods are calendar months unless stated.</li></ul>`);
out.push(endCh);

/* 12 rollout */
out.push(chapter('The first 13 weeks', 'A proposed order for switching the system on, from foundations to the festive season.', {ey:'Rollout · added'}));
out.push(`<div class="cols3">${ROADMAP.map(r => `<div class="card"><span class="lbl">${esc(r[0])}</span><h3 style="margin-top:0">${esc(r[1])}</h3><ul class="small">${r[2].map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`);
out.push(endCh);

/* 13 glossary + sources */
out.push(chapter('Glossary and sources', '', {ey:'Appendix'}));
out.push(`<table><tbody>${GLOSS.concat([['MICE','Meetings, incentives, conferences and exhibitions: company group travel and events.'],['OTA','Online travel agency, such as MakeMyTrip, Cleartrip, Yatra, EaseMyTrip, Booking.com or Expedia.'],['Duty of care','A company’s responsibility for its employees’ safety and wellbeing while travelling for work.'],['Attrition clause','Contract terms for how many booked rooms or places a group may release before a penalty applies.'],['DLT','Distributed ledger registration that Indian telecom rules require for commercial SMS senders and templates.'],['DPDP Act','India’s Digital Personal Data Protection Act, 2023.']]).map(g => `<tr><td class="k" style="width:34mm">${esc(g[0])}</td><td>${esc(g[1])}</td></tr>`).join('')}</tbody></table>
<h2>Benchmark sources</h2>
<table><tbody>${SOURCES.map(s => `<tr><td class="k" style="width:62mm">${esc(s[0])}</td><td class="mono small" style="word-break:break-all">${esc(s[1])}</td></tr>`).join('')}</tbody></table>
<h2>What came from the plan, and what was added</h2>
<p>From the plan: the seven channels, their flows, the descriptions of Consumer, Supply, Creator, Destination &amp; Merchant, Corporate, Lifecycle and Internal communications, the twelve internal streams and the closing principle. Added in this document: the customer lifecycle, journey, decision paths and mind maps; partner lifecycles; sales lifecycles for properties, travel agencies and enquiries; corporate travel and MICE; benchmarks; every workflow step, owner and time limit; the new workflows; KPIs, formulas and targets process; the operating rhythm and rollout. All additions are proposals for the team to adjust and approve.</p>`);
out.push(endCh);

document.getElementById('doc').innerHTML = out.join('');
document.getElementById('tocList').innerHTML = TOC.map(t => `<a href="#${t.id}" data-tocref="${esc(t.title)}"><b>${t.n}</b><span>${esc(t.title)}</span><em data-pg>—</em></a>`).join('');
