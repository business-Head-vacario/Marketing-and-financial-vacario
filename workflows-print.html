<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vacario Communication Workflows</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
/* Print document: A4 landscape. Open in Chrome and print, or render headless, to get the PDF. */
@page{size:297mm 210mm; margin:0}
:root{
  --ground:#ffffff; --paper:#f6f7f3; --well:#eceee7;
  --ink:#15191a; --ink-2:#4f5652; --ink-3:#858c87;
  --rule:#d8dcd2; --rule-2:#bfc5b8;
  --accent:#0e5b5e; --accent-2:#2f8a86; --accent-soft:#dcebea; --accent-ink:#0a4446;
  --warm:#d9602e; --warm-soft:#fbe6dc;
  --gold:#b98309; --gold-soft:#fbf0d2;
  --crit:#c23434; --crit-soft:#f8dddd;
  --l1:#e3efee; --l2:#f3efe4; --l3:#e8edf5; --l4:#f2e8ee; --l5:#eaf1e4;
}
*{box-sizing:border-box}
html,body{margin:0; background:#8a8f8a}
body{font:400 8.6pt/1.42 'IBM Plex Sans', 'Liberation Sans', Arial, sans-serif; color:var(--ink); -webkit-print-color-adjust:exact; print-color-adjust:exact}
.mono{font-family:'IBM Plex Mono','Liberation Mono',monospace; font-variant-numeric:tabular-nums}
.cond{font-family:'IBM Plex Sans Condensed','IBM Plex Sans','Liberation Sans Narrow',sans-serif}

.page{width:297mm; height:210mm; background:var(--ground); position:relative; overflow:hidden;
  padding:11mm 13mm 12mm; display:flex; flex-direction:column; gap:4.2mm; page-break-after:always; break-after:page; margin:0 auto 6mm}
@media print{ html,body{background:none} .page{margin:0} }
.page:last-child{page-break-after:auto; break-after:auto}

/* running header / footer */
.run{display:flex; justify-content:space-between; align-items:baseline; font:500 6.8pt/1 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); border-bottom:.3mm solid var(--rule); padding-bottom:2.2mm}
.run b{color:var(--accent); font-weight:600}
.foot{position:absolute; left:13mm; right:13mm; bottom:5.5mm; display:flex; justify-content:space-between; font:500 6.4pt/1 'IBM Plex Mono',monospace; color:var(--ink-3); letter-spacing:.06em}

h1,h2,h3{margin:0; font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif; text-wrap:balance}
h2{font-size:21pt; font-weight:700; line-height:1; letter-spacing:-.01em}
h3{font:600 7pt/1 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2)}
p{margin:0}
.lead{font-size:9.6pt; color:var(--ink-2); max-width:150mm}
.eyebrow{font:600 7pt/1 'IBM Plex Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--accent)}

/* channel header band */
.band{display:grid; grid-template-columns:22mm minmax(0,1fr) auto; gap:0 5mm; align-items:end}
.bigno{font:700 38pt/0.8 'IBM Plex Sans Condensed',sans-serif; color:var(--accent); letter-spacing:-.02em}
.band .sub{font-size:9pt; color:var(--ink-2); margin-top:1.6mm; max-width:175mm}
.tags{display:flex; flex-wrap:wrap; gap:1.4mm; justify-content:flex-end; max-width:78mm}
.tag{font:500 6.4pt/1 'IBM Plex Mono',monospace; letter-spacing:.05em; text-transform:uppercase; padding:1.3mm 1.9mm; border-radius:.8mm; background:var(--accent-soft); color:var(--accent-ink); white-space:nowrap}
.pageno{font:600 7pt/1 'IBM Plex Mono',monospace; color:var(--ink-3)}

/* plan chain */
.chain{display:flex; align-items:stretch; flex-wrap:nowrap}
.cn{display:flex; align-items:center; padding:1.8mm 3mm; font-size:7.6pt; font-weight:500; background:var(--paper); border:.3mm solid var(--rule-2);
  clip-path:polygon(0 0, calc(100% - 2.4mm) 0, 100% 50%, calc(100% - 2.4mm) 100%, 0 100%, 2.4mm 50%); padding-inline:4.2mm; margin-right:-1.2mm; line-height:1.2}
.cn:first-child{clip-path:polygon(0 0, calc(100% - 2.4mm) 0, 100% 50%, calc(100% - 2.4mm) 100%, 0 100%); background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600}
.cn:last-child{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.chain-row{display:flex; align-items:center; gap:3mm}
.chain-row .lbl{font:600 6.4pt/1.2 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); width:22mm; flex:none}

/* swimlane */
.swim{position:relative; border:.3mm solid var(--rule-2); border-radius:1mm; flex:1 1 auto; min-height:0; display:grid; overflow:hidden; row-gap:0}
.swim .box{margin-block:2mm}
.swim .lane-bg{grid-column:1 / -1; border-top:.3mm solid var(--rule)}
.swim .lane-bg:first-of-type{border-top:0}
.lane-name{display:flex; align-items:center; padding:0 2.6mm; font:600 7pt/1.2 'IBM Plex Sans',sans-serif; color:var(--ink); border-right:.3mm solid var(--rule-2); z-index:1}
.box{z-index:2; align-self:center; margin:0 1.6mm; background:#fff; border:.35mm solid var(--accent); border-radius:1.2mm; padding:1.6mm 1.9mm 1.8mm; min-height:11mm; display:flex; flex-direction:column; gap:.8mm; box-shadow:0 .4mm 0 rgba(14,91,94,.12)}
.box .n{display:flex; align-items:flex-start; gap:1.3mm; color:var(--accent)}
.box .s{font:500 5.9pt/1.25 'IBM Plex Mono',monospace; color:var(--ink-3); border-top:.25mm dotted var(--rule-2); padding-top:.8mm; margin-top:auto}
.box.first .s{color:#bfe1de; border-top-color:#5d9a98}
.box .n i{flex:none; font:600 6pt/1 'IBM Plex Mono',monospace; font-style:normal; width:4.2mm; height:4.2mm; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:6pt}
.box .t{font:600 7.8pt/1.18 'IBM Plex Sans',sans-serif}
.box .o{font-size:6.3pt; line-height:1.25; color:var(--ink-2)}
.box.first{background:var(--accent); color:#fff} .box.first .n{color:#fff} .box.first .n i{background:#fff; color:var(--accent)} .box.first .o{color:#d8ecea}
.box.last{border-color:var(--warm); box-shadow:0 .4mm 0 rgba(217,96,46,.18)} .box.last .n i{background:var(--warm)}
.box .loop{font:500 6pt/1.2 'IBM Plex Mono',monospace; color:var(--warm)}
svg.wires{position:absolute; inset:0; width:100%; height:100%; z-index:1; overflow:visible; pointer-events:none}
.gate{position:absolute; z-index:3; transform:translate(-50%,-50%); font:600 5.8pt/1 'IBM Plex Mono',monospace; background:var(--gold-soft); color:var(--gold); border:.3mm solid var(--gold); padding:1mm 1.4mm; border-radius:.8mm; white-space:nowrap}

.io{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4mm}
.io > div{border-top:.6mm solid var(--accent); padding-top:1.8mm}
.io > div.w{border-top-color:var(--warm)}
.io > div.g{border-top-color:var(--gold)}
.io ul{margin:1.4mm 0 0; padding-left:3.6mm}
.io li{margin:0 0 .5mm; font-size:7.6pt}
.io li b{font-weight:600}

/* tables */
table{border-collapse:collapse; width:100%}
th{font:600 6.2pt/1.2 'IBM Plex Mono',monospace; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); text-align:left; background:var(--well); padding:1.8mm 2mm; border-bottom:.35mm solid var(--ink)}
td{padding:1.6mm 2mm; border-bottom:.25mm solid var(--rule); vertical-align:top; font-size:7.5pt; line-height:1.34}
td ul{margin:0; padding-left:3.2mm}
td li{margin:0 0 .3mm}
td.num{width:7mm}
.sn{width:5.2mm; height:5.2mm; border-radius:50%; border:.35mm solid var(--accent); color:var(--accent); display:grid; place-items:center; font:600 6.6pt/1 'IBM Plex Mono',monospace}
td.step{font-weight:600; font-size:8pt; width:30mm}
td.muted{color:var(--ink-2)}
.sla{display:inline-block; font:500 6.4pt/1.25 'IBM Plex Mono',monospace; background:var(--accent-soft); color:var(--accent-ink); padding:.6mm 1.3mm; border-radius:.6mm}
.pill{display:inline-block; font:600 6pt/1 'IBM Plex Mono',monospace; padding:.9mm 1.4mm; border-radius:.6mm; white-space:nowrap}
.pill.lead{background:var(--accent-soft); color:var(--accent-ink)}
.pill.lag{background:var(--gold-soft); color:var(--gold)}
.dir{font:700 9pt/1 'IBM Plex Mono',monospace}
.dir.up{color:var(--accent)} .dir.down{color:var(--warm)} .dir.hold{color:var(--gold)}
.tgt{display:block; border-bottom:.3mm dashed var(--rule-2); height:4.6mm; min-width:16mm}
.formula{font:500 6.7pt/1.3 'IBM Plex Mono',monospace; color:var(--accent-ink); margin-top:.6mm}

/* KPI flow (stage pipeline with conversion metrics between) */
.kflow{display:flex; align-items:stretch}
.stage{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:1.2mm}
.stage .bar{width:100%; height:11mm; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; font:600 7.6pt/1.1 'IBM Plex Sans',sans-serif; padding:0 3.4mm;
  clip-path:polygon(0 0, calc(100% - 3mm) 0, 100% 50%, calc(100% - 3mm) 100%, 0 100%, 3mm 50%)}
.stage:first-child .bar{clip-path:polygon(0 0, calc(100% - 3mm) 0, 100% 50%, calc(100% - 3mm) 100%, 0 100%)}
.stage .m{font-size:6.6pt; color:var(--ink-2); text-align:center; line-height:1.2; padding:0 1mm}
.conv{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; width:0; position:relative; z-index:2}
.conv span{position:absolute; top:18.2mm; transform:translateX(-50%); font:600 6pt/1.15 'IBM Plex Mono',monospace; color:var(--warm); background:var(--warm-soft); border:.25mm solid var(--warm); border-radius:.6mm; padding:.8mm 1.2mm; text-align:center; white-space:nowrap}

.split{display:grid; grid-template-columns:minmax(0,1fr) 68mm; gap:6mm; min-height:0}
.card{border:.3mm solid var(--rule-2); border-radius:1mm; padding:2.6mm 3mm; background:var(--paper)}
.card h3{margin-bottom:1.8mm}
.card ul{margin:0; padding-left:3.6mm}
.card li{margin-bottom:.9mm; font-size:7.8pt}
.card + .card{margin-top:3mm}
.legend .card, .xbottom .card{margin-top:0}
.proof{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:3mm}
.proof div{border:.3mm solid var(--rule-2); border-radius:1mm; padding:2.2mm 2.6mm; background:var(--paper)}
.proof b{display:block; font:600 8.4pt/1.2 'IBM Plex Sans',sans-serif; margin-bottom:1mm}
.proof span{font:500 6.8pt/1.35 'IBM Plex Mono',monospace; color:var(--accent-ink)}
.note{font-size:6.8pt; color:var(--ink-3); line-height:1.35}

/* cover */
.cover{background:var(--accent); color:#fff; padding:16mm 18mm}
.cover .eyebrow{color:#a9d6d2}
.cover h1{font-size:52pt; line-height:.9; font-weight:700; letter-spacing:-.02em; margin-top:6mm; max-width:210mm}
.cover .tel{font-size:12pt; margin-top:8mm; color:#d7ecea; max-width:200mm}
.cover .tel small{display:block; font-size:9pt; color:#a9d6d2; margin-top:1.5mm}
.cover .grid7{position:absolute; left:18mm; right:18mm; bottom:16mm; display:grid; grid-template-columns:repeat(7,1fr); gap:2.4mm}
.cover .grid7 div{border-top:.6mm solid #7cc3bd; padding-top:2.2mm; font:600 9pt/1.2 'IBM Plex Sans Condensed',sans-serif}
.cover .grid7 div span{display:block; font:500 7pt/1 'IBM Plex Mono',monospace; color:#a9d6d2; margin-bottom:1.4mm}
.cover .quote{position:absolute; right:18mm; top:16mm; font:500 7pt/1.4 'IBM Plex Mono',monospace; color:#a9d6d2; text-align:right; letter-spacing:.08em; text-transform:uppercase}

.cover .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6mm; margin-top:14mm; max-width:230mm}
.cover .stats div{font-size:9pt; color:#d7ecea; line-height:1.3}
.cover .stats b{display:block; font:700 30pt/1 'IBM Plex Sans Condensed',sans-serif; color:#fff; margin-bottom:1.6mm}
/* explained */
.xgrid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:7mm; min-height:0}
.xgrid h3{margin-bottom:1.6mm}
.xp{font-size:9.2pt; line-height:1.5; color:var(--ink); margin-bottom:4mm}
.story{background:var(--accent-soft); border:.3mm solid #b7d6d3; border-radius:1.2mm; padding:3.6mm 4mm}
.story h3{color:var(--accent-ink); margin-bottom:1.6mm}
.story p{font-size:9pt; line-height:1.6; color:var(--ink)}
.story b{font:600 7.4pt/1 'IBM Plex Mono',monospace; color:#fff; background:var(--accent); padding:.5mm 1.1mm; border-radius:.6mm}
.story .note{margin-top:2.4mm; font-size:6.8pt}
.xbottom{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:7mm; margin-top:auto}
.rules{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:1.6mm}
.rules li{display:grid; grid-template-columns:4mm 1fr; gap:1.6mm; font-size:8.2pt}
.rules li::before{content:"✓"; color:var(--accent); font-weight:700}
td.bad{color:var(--crit); font-weight:600; width:46%}

/* KPI formula cards */
.kgrid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:4mm; flex:1 1 auto; min-height:0}
.kcard{border:.3mm solid var(--rule-2); border-radius:1.2mm; padding:3mm 3.2mm 2.6mm; display:flex; flex-direction:column; gap:1.9mm; background:#fff; min-height:0}
.kc-hd{display:flex; justify-content:space-between; align-items:flex-start; gap:2mm}
.kc-hd > b{font:600 10pt/1.2 'IBM Plex Sans',sans-serif}
.kc-hd > span{display:flex; gap:1.2mm; align-items:center; flex:none}
.kc-w{font-size:7.8pt; color:var(--ink-2); line-height:1.4}
.lbl{display:block; font:600 5.9pt/1 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:1.1mm}
.kc-f{background:var(--paper); border-left:.8mm solid var(--accent); padding:2mm 2.4mm; border-radius:0 .8mm .8mm 0}
.eq{display:flex; align-items:center; flex-wrap:nowrap; gap:1.6mm; font:500 7.4pt/1.25 'IBM Plex Mono',monospace; color:var(--accent-ink)}
.frac{display:inline-flex; flex-direction:column; align-items:center; text-align:center; min-width:0; flex:0 1 auto}
.eq > *{flex:none}
.eq > .frac{flex:0 1 auto}
.frac > span{padding:0 1mm}
.frac .nu{border-bottom:.3mm solid currentColor; padding-bottom:.7mm}
.frac .de{padding-top:.7mm}
.ftext{font:500 7.4pt/1.4 'IBM Plex Mono',monospace; color:var(--accent-ink)}
.kc-ex{background:var(--gold-soft); border-radius:.8mm; padding:1.8mm 2.4mm}
.kc-ex .eq, .kc-ex .ftext{color:#6b4d05}
.kc-ex .ftext b, .kc-ex .res{font-weight:700; color:#4a3400; font-size:8.4pt}
.kc-r{font-size:7.4pt; line-height:1.4}
.kc-ft{margin-top:auto; padding-top:1.6mm; border-top:.25mm dotted var(--rule-2); font:500 6.2pt/1.3 'IBM Plex Mono',monospace; color:var(--ink-3)}
.gloss{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:3mm 5mm}
.gloss div{border-top:.4mm solid var(--accent); padding-top:1.6mm; font-size:7.6pt; color:var(--ink-2); line-height:1.4}
.gloss b{display:block; font:600 9pt/1.2 'IBM Plex Sans',sans-serif; color:var(--ink); margin-bottom:.8mm}

/* contents */
.toc{display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; gap:0 10mm}
.toc a{display:grid; grid-template-columns:12mm 1fr auto; gap:3mm; align-items:baseline; padding:2.4mm 0; border-bottom:.25mm solid var(--rule); color:var(--ink); text-decoration:none}
.toc a b{font:600 9pt/1 'IBM Plex Mono',monospace; color:var(--accent)}
.toc a span{font-size:10pt; font-weight:500}
.toc a em{font:500 7.5pt/1 'IBM Plex Mono',monospace; color:var(--ink-3); font-style:normal}
.legend{display:grid; grid-template-columns:repeat(3,1fr); gap:3mm 4mm}
.legend .card{background:#fff}

/* map */
svg text{font-family:'IBM Plex Sans','Liberation Sans',sans-serif}

/* KPI tree */
.tree{display:flex; flex-direction:column; align-items:center; gap:9mm; position:relative}
.tnode{border:.4mm solid var(--accent); border-radius:1.2mm; background:#fff; padding:4mm 4mm; text-align:center}
.tnode.root{background:var(--accent); color:#fff; padding:3.4mm 8mm}
.tnode.root .k{font:700 18pt/1.1 'IBM Plex Sans Condensed',sans-serif}
.tnode .k{font:600 11.5pt/1.2 'IBM Plex Sans',sans-serif}
.tnode .c{font:500 7.2pt/1.2 'IBM Plex Mono',monospace; color:var(--accent); margin-top:1mm; letter-spacing:.06em; text-transform:uppercase}
.tnode.root .c{color:#bfe1de}
.tnode ul{margin:2.4mm 0 0; padding:0; list-style:none; font-size:8.6pt; color:var(--ink-2); line-height:1.35}
.trow{display:grid; gap:4mm; width:100%}
.tnode.en{border-color:var(--gold); border-style:dashed}
.tnode.en .c{color:var(--gold)}

/* RACI */
.raci td, .raci th{text-align:center; padding:1.9mm 1.4mm}
.raci td:first-child, .raci th:first-child{text-align:left}
.raci th{font-size:5.9pt; letter-spacing:.04em; vertical-align:bottom}
.r{display:inline-grid; place-items:center; width:6mm; height:6mm; border-radius:1mm; font:700 7.6pt/1 'IBM Plex Mono',monospace}
.r.A{background:var(--accent); color:#fff} .r.R{background:var(--accent-soft); color:var(--accent-ink)}
.r.C{background:var(--gold-soft); color:var(--gold)} .r.I{background:var(--well); color:var(--ink-3)}

/* cadence grid */
.cad td{vertical-align:top; font-size:7.1pt}
.cad td.on{background:var(--accent-soft)}
.cad td ul{padding-left:3mm}
.week{display:grid; grid-template-columns:24mm repeat(5,1fr); border:.3mm solid var(--rule-2); border-radius:1mm; overflow:hidden}
.week > div{padding:1.6mm 2mm; border-bottom:.25mm solid var(--rule); border-right:.25mm solid var(--rule); font-size:7pt; min-height:9mm}
.week .h{background:var(--well); font:600 6.4pt/1 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); min-height:0}
.week .ev{background:var(--accent-soft); color:var(--accent-ink); border-radius:.6mm; padding:.8mm 1.2mm; margin-bottom:.8mm; font-weight:500}
.week .ev.w{background:var(--warm-soft); color:var(--warm)}
.week .ev.g{background:var(--gold-soft); color:var(--gold)}
.sev{display:inline-block; font:700 6.6pt/1 'IBM Plex Mono',monospace; padding:1mm 1.6mm; border-radius:.6mm}
.sev.s1{background:var(--crit-soft); color:var(--crit)} .sev.s2{background:var(--gold-soft); color:var(--gold)} .sev.s3{background:var(--accent-soft); color:var(--accent-ink)}
</style>
</head>

<div id="doc"></div>

<script>
/* ------------------------------------------------------------------ data */
const CH = [
{

const fmtN = (v, money) => (money ? '₹' : '') + Number(v).toLocaleString('en-IN');
const fmtP = v => (Math.round(v * 10) / 10).toLocaleString('en-IN') + '%';

function fText(k){
  if (!Array.isArray(k.f)) return k.f;
  const [n, d] = k.f;
  return k.u === '%' ? `${n} ÷ ${d} × 100` : k.u === 'inv' ? `(1 − ${n} ÷ ${d}) × 100` : `${n} ÷ ${d}`;
}
const frac = (n, d) => `<span class="frac"><span class="nu">${n}</span><span class="de">${d}</span></span>`;
const nw = t => `<span style="white-space:nowrap">${t}</span>`;
const wrapF = (u, f) => u === 'inv' ? `${nw('(1 −')}${f}${nw(') × 100')}` : u === '%' ? `${f}${nw('× 100')}` : f;
function fBlock(k){
  if (!Array.isArray(k.f)) return `<div class="ftext">${esc(k.f)}</div>`;
  return `<div class="eq">${wrapF(k.u, frac(esc(k.f[0]), esc(k.f[1])))}</div>`;
}
function exBlock(k){
  if (!Array.isArray(k.ex)) return `<div class="ftext">${k.ex}</div>`;
  const [n, d] = k.ex;
  let res;
  if (k.u === '%') res = fmtP(n / d * 100);
  else if (k.u === 'inv') res = fmtP((1 - n / d) * 100);
  else if (k.u === '₹') res = fmtN(Math.round(n / d), true);
  else res = (n / d).toFixed(1) + (k.per || '×');
  return `<div class="eq">${wrapF(k.u, frac(fmtN(n, k.nm), fmtN(d)))}${nw(`= <span class="res">${res}</span>`)}</div>`;
}

      <div class="story"><h3>Worked example: one pass through the workflow</h3><p>${X.story}</p>
        <p class="note">Numbers in boxes are the steps on the workflow page that follows. People and places are illustrations.</p></div>
    </div>
    <div><h3 style="margin-bottom:2mm">How we know it is working · first four KPIs, full formula cards on pages that follow</h3>
      <div class="proof">${c.kpi.slice(0,4).map(k => `<div><b>${esc(k[0])} <span class="dir ${DIR[k[5]][1]}" style="font-size:8pt">${DIR[k[5]][0]}</span></b><span>${esc(fText(kx(k[0])))}</span></div>`).join('')}</div></div>
    <div class="xbottom">
      <div><h3 style="margin-bottom:2mm">Rules that keep it working</h3><ul class="rules">${X.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
      <div><h3 style="margin-bottom:2mm">Where it usually breaks, and what to do</h3>
        <table><thead><tr><th>Warning sign</th><th>What to do</th></tr></thead>
        <tbody>${X.breaks.map(b => `<tr><td class="bad">${esc(b[0])}</td><td>${esc(b[1])}</td></tr>`).join('')}</tbody></table></div>
    </div>
  `, {section:`${c.n} · ${c.name} · explained`}));

  const laneKeys = Object.keys(c.lanes);
  const nCol = c.steps.length;
  const boxes = c.steps.map((s,i) => `
    <div class="box ${i===0?'first':''} ${i===nCol-1?'last':''}" data-i="${i}" style="grid-row:${laneKeys.indexOf(s.l)+1}; grid-column:${i+2}">
      <div class="n"><i>${i+1}</i><span class="t">${esc(s.t)}</span></div>
      <div class="o">→ ${esc(s.out)}</div>
      ${s.loop ? `<div class="loop">↺ ${esc(s.loop)}</div>` : ''}
    </div>`).join('');
  const lanes = laneKeys.map((k,r) => `
    <div class="lane-bg" style="grid-row:${r+1}; background:var(--l${r%5+1})"></div>
    <div class="lane-name" style="grid-row:${r+1}; grid-column:1">${esc(c.lanes[k])}</div>`).join('');
  const gates = c.steps.map((s,i) => s.gate ? `<div class="gate" data-gate="${i}">◆ ${esc(s.gate)}</div>` : '').join('');

  /* A — workflow */
  out.push(page(`
    ${band(c, 'Workflow')}

    </div>
    <div class="io">
      <div><h3>Inputs from</h3><ul>${c.in.map(x => `<li><b>${esc(x[0])}:</b> ${esc(x[1])}</li>`).join('')}</ul></div>
      <div class="g"><h3>Cadence</h3><ul>${c.cad.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="w"><h3>Hands off to</h3><ul>${c.hand.map(x => `<li><b>${esc(x[0])}:</b> ${esc(x[1])}</li>`).join('')}</ul></div>
    </div>
  `, {section:`${c.n} · ${c.name} · workflow`}));

  /* B — detailed steps */
  out.push(page(`
    ${band(c, 'Step plan')}

  /* C — KPI scorecard */
  const flow = c.flow.map((f,i) => `

  out.push(page(`

    <div class="split">

        <thead><tr><th>KPI</th><th>Definition and formula</th><th>Source</th><th>Frequency</th><th>Owner</th><th>Type</th><th style="text-align:center">Good</th><th>Target</th></tr></thead>
        <tbody>${c.kpi.map(k => `<tr>
          <td style="font-weight:600; width:34mm">${esc(k[0])}</td>
          <td><div class="formula" style="margin:0">${esc(fText(kx(k[0])))}</div></td>
          <td class="muted" style="width:26mm">${esc(k[2])}</td>
          <td style="width:16mm">${esc(k[3])}</td>

      </table>
      <div>
        <div class="card"><h3>Objectives</h3><ul>${c.obj.map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>
        <div class="card"><h3>Review</h3><ul>${c.cad.map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>
        <p class="note" style="margin-top:3mm">Set each target from the budget model before launch, then review it each quarter.</p>
      </div>
    </div>
  `, {section:`${c.n} · ${c.name} · KPIs`}));

  /* D — KPI formula cards, six per page */
  for (let i = 0; i < c.kpi.length; i += 6){
    const chunk = c.kpi.slice(i, i + 6);
    out.push(page(`
      <div class="band">
        <div class="bigno" style="font-size:28pt">${c.n}</div>
        <div><div class="eyebrow">KPI formulas · ${i/6 + 1} of ${Math.ceil(c.kpi.length/6)}</div><h2 style="font-size:17pt">${esc(c.name)}</h2></div>
        <div class="note" style="max-width:80mm; text-align:right">Examples use sample numbers to show the arithmetic.<br>They are not forecasts or targets.</div>
      </div>
      <div class="kgrid" style="grid-template-rows:repeat(2, minmax(0,1fr))">${chunk.map(k => { const K = kx(k[0]); return `
        <div class="kcard">
          <div class="kc-hd"><b>${esc(k[0])}</b><span><span class="pill ${k[6]==='Leading'?'lead':'lag'}">${k[6]}</span><b class="dir ${DIR[k[5]][1]}">${DIR[k[5]][0]}</b></span></div>
          <p class="kc-w">${esc(K.w)}</p>
          <div class="kc-f"><span class="lbl">Formula</span>${fBlock(K)}</div>
          <div class="kc-ex"><span class="lbl" style="color:#8a6a1a">Example</span>${exBlock(K)}</div>
          <p class="kc-r"><span class="lbl">How to read it</span>${esc(K.r)}</p>
          <div class="kc-ft">${esc(k[2])} · ${esc(k[3])} · ${esc(k[4])}</div>

    `, {section:`${c.n} · ${c.name} · KPI formulas`}));
  }
});

  <table><thead><tr><th>Stream</th><th>Covers</th><th>Where it happens</th><th>Cadence</th><th>Runs it</th></tr></thead>
  <tbody>${STREAMS.map(s => `<tr><td style="font-weight:600; width:46mm">${esc(s[0])}</td><td class="muted">${esc(s[1])}</td><td style="width:44mm">${esc(s[2])}</td><td style="width:30mm"><span class="sla">${esc(s[3])}</span></td><td style="width:30mm">${esc(s[4])}</td></tr>`).join('')}</tbody></table>

const ESC = ['Detect','Log in escalation channel','Set severity','Escalate to owner','Contain','Communicate','Resolve','Post-mortem & file'];
out.push(page(`

  <div class="kflow" style="padding-bottom:2mm">${ESC.map((e,i) => `<div class="stage"><div class="bar" style="background:${i<3?'#c23434':i<6?'#d9602e':'#0e5b5e'}; font-size:7pt">${esc(e)}</div></div>`).join('')}</div>
  <table><thead><tr><th>Severity</th><th>Examples</th><th>Acknowledge</th><th>Escalate to</th><th>Who is told</th><th>Update every</th></tr></thead>
  <tbody>
    <tr><td><span class="sev s1">SEV 1</span></td><td>App or payments down, travellers stranded, safety incident, legal threat, press story</td><td><span class="sla">15 min, any hour</span></td><td>CEO + function head at once</td><td>Affected customers and partners; media only through the spokesperson</td><td>30 min</td></tr>
    <tr><td><span class="sev s2">SEV 2</span></td><td>Supplier overbooking, API sync failure, complaint going public on social</td><td><span class="sla">1 h, working hours</span></td><td>Function head, same day</td><td>Affected customers and partners</td><td>4 h</td></tr>
    <tr><td><span class="sev s3">SEV 3</span></td><td>Single customer issue, minor bug, vendor delay</td><td><span class="sla">Next check-in</span></td><td>Team lead</td><td>The customer involved</td><td>Daily</td></tr>
  </tbody></table>
  <div class="split" style="grid-template-columns:1fr 1fr">
    <div>
      <h3 style="margin-bottom:2mm">Handoff clock · until 31 Oct 2026 (Canada on EDT)</h3>
      <table><thead><tr><th>India (IST)</th><th>Canada Eastern (EDT)</th><th>Philippines (PHT)</th><th>What happens</th></tr></thead><tbody>

/* KPI summary */
const allK = CH.flatMap(c => c.kpi.map(k => [c.n, c.name.replace(' Communications',''), ...k]));
const third = Math.ceil(allK.length/3);
const kt = rows => `<table><thead><tr><th></th><th>KPI</th><th>Freq.</th><th>Type</th><th style="text-align:center">Good</th></tr></thead><tbody>${rows.map(k =>
  `<tr><td class="mono" style="color:var(--accent); width:7mm; padding-block:1.35mm">${k[0]}</td><td style="padding-block:1.35mm; font-size:7pt">${esc(k[2])}</td><td class="muted" style="padding-block:1.35mm; font-size:6.8pt">${esc(k[5])}</td><td style="padding-block:1.35mm"><span class="pill ${k[8]==='Leading'?'lead':'lag'}" style="font-size:5.4pt; padding:.6mm 1mm">${k[8]}</span></td><td style="text-align:center; padding-block:1.35mm"><b class="dir ${DIR[k[7]][1]}" style="font-size:8pt">${DIR[k[7]][0]}</b></td></tr>`).join('')}</tbody></table>`;

  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5mm">${kt(allK.slice(0,third))}${kt(allK.slice(third,2*third))}${kt(allK.slice(2*third))}</div>

`, {section:'KPI summary'}));

document.getElementById('doc').innerHTML = out.join('').replaceAll('__TOTAL__', String(pageNo));

/* ------------------------------------------------------------------ swimlane connectors */
function wire(){
  document.querySelectorAll('[data-swim]').forEach(sw => {
    const R = sw.getBoundingClientRect();
    const svg = sw.querySelector('svg.wires');
    const bx = [...sw.querySelectorAll('.box')].sort((a,b) => a.dataset.i - b.dataset.i).map(b => {
      const r = b.getBoundingClientRect();
      return {l:r.left-R.left, r:r.right-R.left, t:r.top-R.top, b:r.bottom-R.top, cy:(r.top+r.bottom)/2-R.top, cx:(r.left+r.right)/2-R.left};
    });
    let d = '';
    const mids = [];
    for (let i=0; i<bx.length-1; i++){
      const a = bx[i], b = bx[i+1];
      const x1 = a.r, y1 = a.cy, x2 = b.l - 1.5, y2 = b.cy, xm = (x1 + b.l)/2;
      d += Math.abs(y1-y2) < 1 ? `<path d="M${x1},${y1} H${x2}" marker-end="url(#m)"/>`
        : `<path d="M${x1},${y1} H${xm} V${y2} H${x2}" marker-end="url(#m)"/>`;
      mids.push({x:xm, y:Math.abs(y1-y2)<1 ? y1 : (y1+y2)/2});
    }
    svg.innerHTML = `<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e5b5e"/></marker></defs>
      <g fill="none" stroke="#0e5b5e" stroke-width="1.3">${d}</g>`;
    sw.querySelectorAll('.gate').forEach(g => {
      const i = +g.dataset.gate;
      const a = bx[i];
      if (!a) return;
      g.style.left = a.cx + 'px';
      g.style.top = (a.t - 5) + 'px';
    });
  });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(wire); else wire();
window.addEventListener('load', wire);
